[project]
name = "oncesealed"
version = "0.1.0"
description = "Confidential but auditable carbon credit retirement layer with evidence-backed AI quality reports"
requires-python = ">=3.11"
dependencies = [
    "eth-abi",
    "eth-account",
    "eth-utils",
    "fastapi",
    "httpx",
    "json-repair",
    "openai",
    "pandas",
    "pyarrow",
    "pydantic",
    "pynacl",
    "pymupdf",
    "uvicorn",
    "python-dotenv",
    "web3",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
