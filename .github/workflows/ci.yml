name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - uses: foundry-rs/foundry-toolchain@v1  # anvil for the end-to-end chain tests
        with:
          version: v1.8.5
      - name: Unit and end-to-end tests (local anvil, no API calls)
        run: python -m pytest -q
      - name: Web data matches the repository (run scripts/export_web_data.py after changes)
        run: |
          python scripts/export_web_data.py
          git diff --exit-code web/src/data/site.json web/public/reports
          test -z "$(git status --porcelain web/public/reports)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src tests
      - name: Browser and Python hash the same way (tests/vectors.json, published reports)
        run: npm test
      - name: Build (type-checks and prerenders every page)
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Tests (incl. fuzz)
        run: forge test -vv
      - name: Committed ABI matches the contract (run scripts/export_artifact.py after changes)
        run: |
          python3 -c "
          import json
          built = json.load(open('out/RetirementRegistry.sol/RetirementRegistry.json'))['abi']
          committed = json.load(open('../core/chain/artifacts/RetirementRegistry.json'))['abi']
          assert built == committed, 'core/chain/artifacts/RetirementRegistry.json is stale'
          print('ABI up to date')
          "
