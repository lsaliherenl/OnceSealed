<style>
  :root { --bg:#f7f7f5; --card:#ffffff; --ink:#1a1a19; --ink2:#55534e; --muted:#8a8780; --line:#e2e0d8;

          --muted:#8f8d86; --line:#33322f; --accent:#5a9be8; --yes:#3fb27a; --no:#e0645b; --unc:#d9a63a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { font-size:16px; }
  .bar { flex:1; min-width:160px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:860px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .meta { color:var(--ink2); font-size:13px; margin-bottom:8px; }
  .para { margin:0; white-space:pre-line; overflow-wrap:anywhere; }
  .pid { font:12px ui-monospace, Consolas, monospace; color:var(--accent); }
  .qid { font-weight:700; margin-right:6px; }
  .tr { color:var(--ink2); font-size:14px; margin:4px 0; }
  .hint { font-size:13px; color:var(--muted); margin:4px 0; }
  .hint b { color:var(--ink2); }
  .opts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .opts label { border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; }
  .opts input { margin-right:6px; }
  .opts input[value=yes]:checked + span { color:var(--yes); font-weight:700; }
  .opts input[value=no]:checked + span { color:var(--no); font-weight:700; }
  .opts input[value=unclear]:checked + span { color:var(--unc); font-weight:700; }
  .nav { display:flex; justify-content:space-between; gap:8px; }
  .intro { max-width:760px; margin:40px auto; padding:0 16px; }
  .intro li { margin-bottom:6px; }
  .keys { font-size:13px; color:var(--muted); }

this \nprocess, all stakeholders could also raise the issue to the Comité de Gestión (CG).  This organization \nincludes representation from all stakeholders involved in the management of the park including \ncommunities, local and regional governments, local organizations, the Park Head and CIMA.  CIMA will \nrecuse itself from all CG meeting items regarding these issues to ensure the impartiality of the review.  \nThis diverse representation provides natural pathways for reporting issues and for providing an \nindependent, third-party review of any issues raised.  Outcomes of the CG reviews will also be provided \nin writing to the submitting individual or community within 30 days. \n \nMinutes of the CG meetings, park guard reports and technician reports will capture the input received \nfrom communities while emails, meeting minutes and phone logs will capture input from primary \nstakeholders.  In addition, reports to funders will often summarize much of the same information.  All of \nthis information will feed into the ICC system to provide data on new threats (illegal activities, tensions \nbetween communities), suggestions or other issues.  As appropriate, CIMA’s strategies and activities will \nbe adjusted better to achieve the project’s goals.  Immediate threats may result in immediate changes in \nactivities and will not require a quarterly ICC review.  The ICC documentation and quarterly project \nreports will capture how the plan has been revised as a result of stakeholder dialogues.   \n \nOnce the regional community meetings have occurred in 2008 and early 2009, a summary document will \nbe prepared in conjunction with the new Plan Maestro documenting this input process, its results, and \nhow the project has been developed in line with this input."}, {"uid": "c004", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D1", "paragraph_id": "p96-23", "page": 96, "text": "Is the project receiving or seeking credit for reductions and removals from a project activity \nunder another GHG programme, or any other form of community, social, or biodiversity unit or \ncredit?"}, {"uid": "c014", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A1", "paragraph_id": "p69-15", "page": 69, "text": "Equity IRR without CDM \nBenchmark (Equity IRR) \nFinal Results \n8.69% \n15.32%"}, {"uid": "c020", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q1", "paragraph_id": "p46-11", "page": 46, "text": "EFgrid,CM,y= EFgrid,OM,y* WOM+ EFgrid,BM,y* WBM"}, {"uid": "c022", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q2", "paragraph_id": "p35-11", "page": 35, "text": "Alternative 2: No proposed project activity and equivalent amount of energy would have \nbeen produced by the grid electricity system through its currently running power plants \nand by new capacity addition to the grid i.e. Continuation of the present situation. \n \nThe PP would have continued without investment in Project activity with usual business activities. \nThe grid would continue with the fossil fuel based power projects and this would result in GHG \nemissions. Hence, the new capacity add-on from a fossil fuel based power plant is appropriate, \nrealistic & credible baseline alternative for the project activity. \n \nOutcome of Sub-step 1a: All the realistic alternatives for the project activity have been enlisted \nabove.  \n \nThus though two alternatives are mentioned above as per step of additionality tool, the first \nalternative is not possible as project activity is not viable without carbon credit benefits and \nsecond alternative is the baseline scenario for the project activity as per methodology as \nmentioned in section 2.4 of joint VCS PD & MR. \nIt is to be noted that being the green field project activity, “the baseline scenario is electricity \ndelivered to the grid by the project activity would have otherwise been generated by the operation \nof grid-connected power plants and by the addition of new generation sources, as reflected in the \ncombined margin (CM) calculations described in the “Tool to calculate the emission factor for an \nelectricity system”."}, {"uid": "c024", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "D2", "paragraph_id": "p21-05", "page": 21, "text": "The project is not included in an emissions trading program or any other mechanism that \nincludes GHG allowance trading."}, {"uid": "c035", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D3", "paragraph_id": "p80-04", "page": 80, "text": "o \nRegular Audits and Monitoring: Continuous internal and third-party audits are conducted \nto ensure compliance with forestry, peatland, and environmental standards \no \nCarbon Offset Reporting and Verification: Emission reduction calculations undergo \nthorough verification in line with the national carbon trading framework, ensuring \ntransparency in reporting and alignment with Indonesia’s NDC targets \no \nGrievance and Environmental Impact Management: Adhering to Ministry of Environment \nregulations, the project has established grievance redress mechanisms to address \nconcerns about environmental degradation and pollution \no \nTraining and Capacity Building: The project involves local communities in forest \nmanagement and fire suppression efforts, which aligns with Ministry of Forestry and \nregional regulations on community engagement."}, {"uid": "c039", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S3", "paragraph_id": "p39-13", "page": 39, "text": "Human-induced risks to the \nproject’s biodiversity benefits, \nboth in the short and long-term, \nare essentially the same to those \nrelated to climate change benefits \n(above) as they relate to the \nprotection and regeneration of the \nnatural ecosystem. In addition, \nthere are further human-induced \nrisks related to hunting pressure, \ntypically focused on a narrow \nrange of species."}, {"uid": "c041", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A2", "paragraph_id": "p42-05", "page": 42, "text": "Thus, the proposed project activity is not a “common practice” within a sector in the \napplicable geographical area."}, {"uid": "c045", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "D2", "paragraph_id": "p68-16", "page": 68, "text": "The Kuamut Rainforest Conservation Project has not applied for or been rejected by any other GHG \nprograms."}, {"uid": "c049", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "S3", "paragraph_id": "p31-10", "page": 31, "text": "No Listed Activities requiring an environmental impact assessment under the National \nEnvironmental Management Act (NEMA, Act 107 of 1998), Environmental Impact"}, {"uid": "c055", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "D2", "paragraph_id": "p45-02", "page": 45, "text": "(b) The project applies the same measure as the proposed project activity;  \n \nAs described above, the project installs new AWMSs to treat the manure from 9 existing swine \nfarms, which can avoid methane emissions generated in the baseline uncovered anaerobic \nlagoons. And the measure of the project belongs to “Methane formation avoidance” as per Tool \n24“Common practice (version03.1).  \n \n(c) The projects use the same energy source/fuel and feedstock as the proposed project activity, \nif a technology switch measure is implemented by the proposed project activity;  \n \nThe project is to treat the manure from the 9 existing swine farms avoid methane emissions \ngenerated in the baseline uncovered anaerobic lagoons through installing new 9 set of AWMSs. \nThe biogas captured for heat generation, which is used for swine farms. \n \n(d) The plants in which the projects are implemented produce goods or services with comparable \nquality, properties and applications areas (e.g., clinker) as the proposed project plant;  \n \n699,486 tons of animal manure waste can be treated annually and the biogas captured for heat \ngeneration.  If the similar projects can treat the manure waste and produce heat should be \nconsidered as the comparable service. \n \n(e) The capacity or output of the projects is within the applicable capacity or output range \ncalculated in Step 1;  \n \nBased on the calculation in Sub-step 4a.1, the output/capacity ranges of similar project are that \ncan handle manure from 349,743 tons to 1,049,229 tons annually. \n \n(f) The projects started commercial operation before the project design document (CDM-PDD) is \npublished for global stakeholder consultation or before the start date of proposed project activity, \nwhichever is earlier for the proposed project activity.  \n \nThe similar project stared commercial operation before the start date of the project at 05-August-\n2020, which is earlier date. \n \nBased on above analysis, it can conclude the project belonging to “Methane formation avoidance” \nwith treatment of manure operated before 05-August-2020, that can handle manure from \n349,743 tons to 1,049,229 tons annually in Henan Province is the similar project as the project \nactivity."}, {"uid": "c062", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "Q2", "paragraph_id": "p46-08", "page": 46, "text": "Leakage shall be considered as default 0.95 in accordance with Section 8.3 of the applied \nmethodology VRM0006 v1."}, {"uid": "c072", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "A2", "paragraph_id": "p33-02", "page": 33, "text": "Therefore, the impact of the stoves will be \nassessed at the sub-national level in accordance \nwith each PI description, and not at the national \nlevel as the commenter suggests. \n \nAdditionally, the National GHG Inventory, \nreferenced in the public commentary, references \nstudies that were published in 2013 and earlier. \nThe socio-economic situation, the affordability of \nelectricity and population density in rural areas in \nSouth Africa has changed considerably in the last \neight years and has since also been exacerbated \nby the global Covid-19 pandemic151617.  \n \nAccording to the Global Forest Watch platform, \nSouth Africa lost 1.48 Mha of tree cover from 2001 \nto 2020, equivalent to a 25% decrease in tree \ncover since 2000. The Global Forest Watch also \nreported that in 2020 alone, South Africa lost \n30.3kha of natural forest.18 \n \nAlthough South Africa’s forestry sector is well \ndeveloped, the heavy dependency of the rural \npoor in South Africa on forest resources is \nexerting pressure on indigenous forests and \nwoodlands2. The unsustainable harvesting of \nfuelwood has resulted in forest degradation, loss \nof millions of hectares of forest (deforestation) and \ndesertification. The annual deforestation rate in \nSouth Africa is estimated to be 0.2 percent.” 19"}, {"uid": "c074", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "S2", "paragraph_id": "p2-24", "page": 2, "text": "2.3 \nEnvironmental Impact ..................................................................................................... 24"}, {"uid": "c077", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "S3", "paragraph_id": "p2-25", "page": 2, "text": "2.4 \nPublic Comments ............................................................................................................. 25"}, {"uid": "c079", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "Q1", "paragraph_id": "p62-02", "page": 62, "text": "For this ARR project activity, Face in 1999 commissioned Meijer to carry out a \nbaseline study whose results show that changes in the carbon stocks for both \nabove and below ground biomass are expected not to exceed actual net GHG \nremovals by sinks and are therefore assumed to be zero in the absence of the \nproject activity. Hence the formula above is only applied to multiply the 5.2 tonnes \nof carbon per hectare (adjusted from Meijer, 1999), which is the conservative \nvalue of the carbon stock in the stratum ‘banana plantation’, with the combined \narea Ai of stratum ‘Planted Area’ and ‘Regenerating Area’. The total area to be \nplanted during the crediting period is presented in Table 7.2 and has a size of \n6,000 hectares. In addition, the Regenerating Area is 2,593 hectares. The \ncombined area is therefore 8,593 hectares. As the baseline is in a steady state, \nthere is no increases in GHG removals. See Annex III for details on the estimation, \nand the spreadsheet ´ Kibale Baseline Recalculation_082711 ´, which details the \ncalculation of the mean tree carbon stock in the baseline, based on inventory data \nby Meijer in 1999. In addition, the carbon stock changes in dead wood, litter and \nsoil organic matter are conservatively assumed to be zero based on the \nmethodology applied."}, {"uid": "c082", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "A3", "paragraph_id": "p36-10", "page": 36, "text": "Applicable \nA single aerobic treatment technique is not suitable for \ntreating low concentration organic wastewater in \nwastewater. This kind of wastewater contains a large \namount of highly concentrated organic wastewater, which \nis difficult to be treated by the aerobic method and does \nnot meet the Chinese environmental quality standards \nand pollutant discharge standards for discharge to water \nbodies. \nAt present a combine Anaerobic Digester-Aerobic \nTreatment system is considered to be one of the most \nadvanced \nmanure \nmanagement \nsystems, \nbut \nto \nimplement such technology need high invest and the \nproposed project will not be invested and constructed \nwithout being registered as a VCS project. \n \n \nOutcome of Step 1a: In summary, the alternatives to the baseline scenario are identified by the \ntool 02:” Combined tool to identify the baseline scenario and demonstrate additionality (Version \n07.0)”as: \nScenario 6: “The manure is disposed in an uncovered anaerobic lagoon”  \nScenario 8&17: Anaerobic Digester-Aerobic Treatment i.e., the project activity not being \nregistered as a VCS project activity. \n \nStep 1b: Consistency with mandatory applicable laws and regulations \nThere is no legal law and regulation to mandate the livestock farm owners to implement \nanaerobic digestion, aerobic or other biological treatment techniques to treat the animal manure \nin China. Only the manure is prohibited to discharge directly into environment without any \ntreatment as per Regulations on Prevention and Control of Pollution from Livestock and Poultry \nFarming11 issued by the State Council in Nov. 2013."}, {"uid": "c091", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "Q2", "paragraph_id": "p132-04", "page": 132, "text": "The 𝐿𝐸𝐵𝐿,𝑁2𝑂,𝑦, 𝐿𝐸𝑃𝐽,𝑁2𝑂,𝑦, , 𝐿𝐸𝐵𝐿,𝐶𝐻4,𝑦 𝑎𝑛𝑑 𝐿𝐸𝑃𝐽,𝐶𝐻4,𝑦,,can be calculated by Equation 34-43"}, {"uid": "c102", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "P1", "paragraph_id": "p26-01", "page": 26, "text": "Project zone (CCB) – combination of the project area and the buffer zone (Figure 1.2).  Because no \nhuman communities exist within the project area, communities within the buffer zone represent all \ncommunities within the project zone.   \n \nOffsite (CCB) – area beyond the project zone. \n \nThe reference region for deforestation, the reference region for location, and the leakage belt are \npresented in Section 3.1.1 along with maps and justifications for the choices made."}], "questions": {"A1": {"text": "Does the text report a quantified financial analysis: at least one numeric financial indicator (such as IRR or NPV) together with a benchmark or threshold value it is compared against?", "tr": "Metinde sayısal bir finansal analiz var mı: en az bir finansal gösterge değeri (IRR, NPV gibi) VE karşılaştırıldığı bir eşik/benchmark değeri?", "yes_if": "İki sayı da metinde: ör. 'equity IRR 9.1% ... benchmark 14.5%'.", "no_if": "Sadece 'IRR benchmark'ın altında' deniyor ama sayılar yok; ya da sadece biri var."}, "A2": {"text": "Does the text discuss common practice, i.e. whether similar activities are already widespread in the region or sector?", "tr": "Metinde 'common practice' analizi var mı: benzer projelerin bölgede/sektörde ne kadar yaygın olduğu?", "yes_if": "Benzer projelerin sayısı/payı veya 'yaygın değil' sonucuna varan bir analiz anlatılıyor.", "no_if": "Konu hiç geçmiyor ya da sadece bölüm başlığı var."}, "A3": {"text": "Does the text state that the project activity is not required by any law or regulation (regulatory surplus)?", "tr": "Metinde projenin yasal bir zorunluluk olmadığı (regulatory surplus) belirtiliyor mu?", "yes_if": "'No law requires...', 'not mandated by regulation' gibi açık bir ifade.", "no_if": "Sadece yasalara uyulduğu söyleniyor (bu farklı bir şey)."}, "A4": {"text": "Does the text state that carbon credit revenue was considered before or at the start of the project (prior consideration), for example with a date or a document?", "tr": "Metinde karbon gelirinin proje kararından önce/başında düşünüldüğü (prior consideration) belirtiliyor mu?", "yes_if": "Bir tarih, yönetim kurulu kararı veya belgeyle karbon gelirinin baştan hesaba katıldığı söyleniyor.", "no_if": "Bu konu geçmiyor."}, "P1": {"text": "Does the text assess the risk that stored carbon is released (reversal or non-permanence risk), for example with a risk tool, a rating or a score?", "tr": "Metinde depolanan karbonun geri salınma (reversal / non-permanence) riski değerlendirilmiş mi?", "yes_if": "Risk aracı, risk puanı/derecesi veya risk faktörlerinin değerlendirmesi var.", "no_if": "Sadece 'kalıcıdır' iddiası var, değerlendirme yok."}, "P2": {"text": "Does the text give a specific buffer contribution (a percentage or a number of credits set aside)?", "tr": "Metinde tampon havuza (buffer) ayrılan pay sayısal olarak veriliyor mu (yüzde veya kredi sayısı)?", "yes_if": "Ör. 'buffer withholding of 12%' ya da ayrılan kredi sayısı.", "no_if": "Buffer'dan söz ediliyor ama sayı yok."}, "P3": {"text": "Does the text describe concrete measures to monitor or prevent reversals (e.g. fire, illegal logging, land conversion)?", "tr": "Metinde geri salınmayı (yangın, kaçak kesim, arazi dönüşümü) izlemek/önlemek için somut önlemler var mı?", "yes_if": "Devriye, yangın izleme, uydu takibi gibi somut faaliyetler anlatılıyor.", "no_if": "Sadece genel niyet beyanı var."}, "Q1": {"text": "Does the text show how baseline emissions are calculated, with an equation, parameter values or a numeric result?", "tr": "Metinde referans (baseline) emisyonlarının nasıl hesaplandığı denklem, parametre değeri veya sayısal sonuçla gösteriliyor mu?", "yes_if": "Bir formül, emisyon faktörü değeri veya hesaplanmış baseline sayısı var.", "no_if": "Sadece 'baseline methodology'ye göre hesaplandı' deniyor."}, "Q2": {"text": "Does the text address leakage (emissions shifted outside the project boundary), either by quantifying it or by justifying why it is zero?", "tr": "Metinde sızıntı (leakage) ele alınmış mı: sayısallaştırılmış ya da neden sıfır olduğu gerekçelendirilmiş?", "yes_if": "Leakage değeri veya 'leakage is not applicable because ...' gibi gerekçe.", "no_if": "Leakage hiç geçmiyor."}, "Q3": {"text": "Does the text address uncertainty or the use of conservative assumptions in the emission reduction estimate?", "tr": "Metinde belirsizlik veya muhafazakâr (conservative) varsayımlar ele alınıyor mu?", "yes_if": "Belirsizlik oranı, indirim faktörü veya bilinçli muhafazakâr seçim anlatılıyor.", "no_if": "Konu geçmiyor."}, "Q4": {"text": "Does the text describe a monitoring plan that names the parameters to be measured and how often or by what method?", "tr": "Metinde ölçülecek parametreleri ve ölçüm sıklığını/yöntemini belirten bir izleme planı var mı?", "yes_if": "Parametre tablosu, ölçüm cihazı, kalibrasyon veya sıklık bilgisi.", "no_if": "Sadece 'izleme yapılacak' deniyor."}, "D1": {"text": "Does the text state whether the project is registered, or issues credits, under another GHG program (e.g. CDM, Gold Standard)?", "tr": "Metinde projenin başka bir karbon programında (CDM, Gold Standard vb.) kayıtlı olup olmadığı belirtiliyor mu?", "yes_if": "'Not registered under any other GHG program' veya 'also registered under CDM' gibi açık ifade.", "no_if": "Konu geçmiyor."}, "D2": {"text": "Does the text address other environmental credits or certificates (e.g. renewable energy certificates, I-RECs) or participation in an emissions trading scheme?", "tr": "Metinde başka çevresel sertifikalar (REC, I-REC vb.) veya emisyon ticaret sistemleri ele alınıyor mu?", "yes_if": "Bu sertifikalar alınmadığı/alındığı ya da ETS'ye katılmadığı açıkça söyleniyor.", "no_if": "Konu geçmiyor."}, "D3": {"text": "Does the text address the host country's national accounting or registry, or a corresponding adjustment?", "tr": "Metinde ev sahibi ülkenin ulusal muhasebesi/kayıt sistemi veya karşılıklı düzeltme (corresponding adjustment) ele alınıyor mu?", "yes_if": "Ulusal kayıt sistemi, NDC muhasebesi veya corresponding adjustment'tan söz ediliyor.", "no_if": "Konu geçmiyor."}, "S1": {"text": "Does the text describe a stakeholder consultation with specifics such as dates, places, participants or comments received?", "tr": "Metinde paydaş görüşmesi tarih, yer, katılımcı veya alınan yorumlar gibi ayrıntılarla anlatılıyor mu?", "yes_if": "En az bir somut ayrıntı (tarih, yer, katılımcı sayısı, gelen yorum).", "no_if": "Sadece 'paydaşlarla görüşüldü' deniyor."}, "S2": {"text": "Does the text describe a grievance or complaint mechanism through which affected people can raise concerns?", "tr": "Metinde etkilenen kişilerin şikâyet iletebileceği bir mekanizma tanımlanıyor mu?", "yes_if": "Şikâyet kanalı (telefon, kutu, e-posta, süreç) anlatılıyor.", "no_if": "Konu geçmiyor."}, "S3": {"text": "Does the text report an environmental impact assessment or an analysis of the project's environmental risks?", "tr": "Metinde çevresel etki değerlendirmesi veya projenin çevresel risklerinin analizi var mı?", "yes_if": "ÇED yapıldığı/gerekmediği gerekçesiyle veya çevresel risk analizi anlatılıyor.", "no_if": "Sadece 'çevreye faydalı' deniyor."}, "S4": {"text": "Does the text address the rights of local communities or indigenous peoples, such as free, prior and informed consent (FPIC) or benefit sharing?", "tr": "Metinde yerel halkın veya yerli halkların hakları (FPIC, fayda paylaşımı vb.) ele alınıyor mu?", "yes_if": "FPIC, fayda paylaşımı, arazi hakları gibi somut bir konu ele alınıyor.", "no_if": "Konu geçmiyor."}}, "rules": ["Yalnızca gösterilen paragrafa bak: kanıt bu paragrafta yoksa \"hayır\" (belgenin başka yerinde olabileceğini düşünme).", "Standardın gereklilik metni (ör. uyum tablosunun sol sütunu) kanıt sayılmaz; projenin kendi beyanı gerekir.", "Alan bilgisiyle çıkarım yapma; metin söylemeli.", "Belirli faaliyetler gelecek zamanla anlatılıyorsa sayılır; yalnızca genel niyet sayılmaz.", "Bir büyüklüğü ölçme yöntemi anlatılıyorsa konu ele alınmış sayılır.", "Adı verilen kurumlar katılımcı sayılır; plan veya rapor tarihleri görüşmenin ayrıntısı değildir."]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const UNITS = DATA.units;
let annotator = null, labels = {}, idx = 0;

// PDF text keeps the PDF's line breaks; join wrapped lines for reading (whitespace only, words unchanged).
const NEW_ITEM = /^([•▪●·–]|-\s|\(?[a-z0-9ivx]{1,4}[.)]\s)/i;
const ENDS_SENTENCE = /[.:;!?)]$/;
function reflow(text) {
  return text.replace(/\r/g, '').split(/\n\s*\n/).map(block => {
    let out = '', prev = '', prevStartsLine = true;
    for (const line of block.split('\n').map(l => l.trim()).filter(Boolean)) {
      const heading = prevStartsLine && prev.length < 70 && /^[A-Z0-9]/.test(prev) && !ENDS_SENTENCE.test(prev) && /^[A-Z]/.test(line);
      let startsLine = false;
      if (!out) { out = line; startsLine = true; }
      else if (NEW_ITEM.test(line) || heading) { out += '\n' + line; startsLine = true; }
      else if (/[a-z]-$/.test(out) && /^[a-z]/.test(line)) out += line;
      else out += ' ' + line;
      prevStartsLine = startsLine || ENDS_SENTENCE.test(prev);
      prev = line;
    }
    return out;
  }).filter(Boolean).join('\n\n');
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const storeKey = () => 'oncesealed-citations-' + annotator;
function save() { try { localStorage.setItem(storeKey(), JSON.stringify(labels)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(storeKey()) || '{}'); } catch (e) { return {}; } }
const answered = () => UNITS.filter(u => labels[u.uid]).length;

function intro() {
  document.getElementById('app').innerHTML = `
  <div class="intro card">
    <h2>Paragraf kontrolü (${UNITS.length} madde)</h2>
    <p>Her maddede bir soru ve belgeden tek bir paragraf var. Soru: <b>bu paragraf, tek başına, sorunun aradığı kanıtı içeriyor mu?</b></p>
    <ul>${DATA.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    <p>Paragrafların bir kısmını model seçti, bir kısmı başka yerlerden; hangisinin hangisi olduğu gösterilmiyor. Model cevaplarına veya <code>key.json</code> dosyasına bakma.</p>
    <p class="keys">Kısayollar: E = evet, H = hayır, B = belirsiz, ← → = önceki/sonraki. Cevaplar bu tarayıcıda saklanır; bitince “Dışa aktar”.</p>
    <p><input id="name" placeholder="Adın" style="font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px">
    <button class="primary" id="start">Başla</button></p>
  </div>`;
  document.getElementById('start').onclick = () => {
    const n = document.getElementById('name').value.trim();
    if (!n) return;
    annotator = n; labels = load();
    idx = Math.max(0, UNITS.findIndex(u => !labels[u.uid]));
    render();
  };
}

function render() {
  const u = UNITS[idx], q = DATA.questions[u.question_id], cur = labels[u.uid] || '';
  document.getElementById('app').innerHTML = `
  <header><b>Paragraf kontrolü</b><span>${esc(annotator)}</span>
    <div class="bar"><div style="width:${100 * answered() / UNITS.length}%"></div></div>
    <span>${answered()} / ${UNITS.length}</span><button id="export">Dışa aktar</button></header>
  <main>
    <div class="card">
      <div class="meta">${idx + 1}. madde · ${esc(u.project_id)} ${esc(u.project_name)} · sayfa ${u.page} · <span class="pid">${esc(u.paragraph_id)}</span></div>
      <p class="para">${esc(reflow(u.text))}</p>
    </div>
    <div class="card">
      <div><span class="qid">${u.question_id}</span>${esc(q.text)}</div>
      <div class="tr">${esc(q.tr)}</div>
      <div class="hint"><b>Evet:</b> ${esc(q.yes_if)}</div>
      <div class="hint"><b>Hayır:</b> ${esc(q.no_if)}</div>
      <div class="opts">
        ${[['yes','Evet'],['no','Hayır'],['unclear','Belirsiz']].map(([v, t]) =>
          `<label><input type="radio" name="a" value="${v}" ${cur === v ? 'checked' : ''}><span>${t}</span></label>`).join('')}
      </div>
    </div>
    <div class="nav"><button id="prev" ${idx === 0 ? 'disabled' : ''}>← Önceki</button>
      <button id="next" class="primary">${idx === UNITS.length - 1 ? 'Son' : 'Sonraki →'}</button></div>
  </main>`;
  document.querySelectorAll('input[name=a]').forEach(r => r.onchange = () => set(r.value));
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.getElementById('export').onclick = exportLabels;
  window.scrollTo(0, 0);
}

function set(v) { labels[UNITS[idx].uid] = v; save(); render(); }
function go(d) { idx = Math.min(UNITS.length - 1, Math.max(0, idx + d)); render(); }

function exportLabels() {
  const out = { annotator, kind: 'human', version: DATA.version, exported_at: new Date().toISOString(),
                answered: answered(), total: UNITS.length,
                labels: UNITS.filter(u => labels[u.uid]).map(u => ({ uid: u.uid, question_id: u.question_id,
                        paragraph_id: u.paragraph_id, answer: labels[u.uid] })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'citations_' + annotator.replace(/\W+/g, '_') + '.json';
  a.click();
}

document.addEventListener('keydown', e => {
  if (!annotator || e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 'e') set('yes'); else if (k === 'h') set('no'); else if (k === 'b') set('unclear');
  else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
intro();
</script>
</body>
</html>
