<script id="data" type="application/json">{"version": "citation-check-v1", "excerpt_chars": 30000, "units": [{"uid": "c001", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "D1", "paragraph_id": "p26-02", "page": 26, "text": "NOT APPLICABLE. \n \n1.14 Project rejected under other GHG programs (if applicable): \n \nNOT APPLICABLE. \n \n1.15 Project proponents roles and responsibilities, including contact \ninformation of the project proponent, other project participants: \n \nFace the Future is a company that was set up with the mission to mitigate climate \nchange by rehabilitating and conserving forests and other ecosystems. Its \npredecessor is Face Foundation (FACE: Forests Absorbing Carbon-dioxide \nEmissions), a Dutch Foundation that was established with the objective to \ndevelop afforestation and reforestation projects in order to combat climate \nchange. The projects that Face Foundation had established are located in \nMalaysia, Ecuador, Uganda, the Czech Republic and the Netherlands. In 2009 Face \nFoundation transferred her projects to Face the Future. This document refers to \nFace the Future’s project activity in the Kibale National Park in Uganda. \nThe Uganda Wildlife Authority (UWA) is one of the governing bodies that \nregulates wildlife conservation in Uganda. UWA was established in 1996 by the \nUganda Wildlife Statute, which merged the Uganda National Parks and the Game \nDepartment. It is governed by a Board of Trustees appointed by minister \nresponsible for wildlife. UWA is in charge of management of 10 National Parks, 12 \nWildlife Reserves, 14 Wildlife Sanctuaries and provides guidance for 5 Community \nWildlife Areas. UWA's mission is to conserve, economically develop and \nsustainably manage the wildlife and Protected Areas of Uganda in partnership \nwith neighboring communities and stakeholders for the benefit of the people of \nUganda and the global community. \n \nTable 1.15.1 Outline of the project proponents and participants for the Kibale ARR \nproject activity."}, {"uid": "c002", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S2", "paragraph_id": "p56-04", "page": 56, "text": "2.3.12 Feedback and Grievance Redress Procedure (G3.8)"}, {"uid": "c003", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "S3", "paragraph_id": "p191-02", "page": 191, "text": "complaints voiced by residents to the field offices. Most items will be easily resolved by the field offices, \nbut when necessary will be forwarded to the Program Director or local law enforcement authorities, as \nappropriate.     \n \nConcerns and comments will be handled in a consistent manner. Depending on the issue, conference \ncalls, in-person meetings, interviews with the commenter or CIMA personnel, and other means will be \nused to obtain additional information as necessary, and appropriate actions will then be taken. Some \ncomplaints have resulted in expanded training, new communications to buffer zone communities, and \neven firing of an employee. There is no formal written procedure for this process but it will be applied \nconsistently and will build on CIMA's close relationship with the buffer zone communities. CIMA’s \nExecutive Director will be ultimately responsible for the resolution of all issues but questions, complaints, \nand comments may be addressed by several individuals within the organization, depending on the topic.  \nTo date, all issues have been satisfactorily resolved through this process.   \n \nWhen issues are addressed immediately in the field by the park guard or technician, the interaction will be \ndocumented in the park guard’s or technician’s report but no formal written summary of the response will \nbe provided to the individual with the question or concern.  If the issue cannot be immediately resolved \nand is forwarded to CIMA’s offices or Headquarters, a written response will be issued to the individual in \nquestion within 30 days. \n   \nIf any stakeholder feels that an issue cannot be or has not been addressed satisfactorily through this \nprocess, all stakeholders could also raise the issue to the Comité de Gestión (CG).  This organization \nincludes representation from all stakeholders involved in the management of the park including \ncommunities, local and regional governments, local organizations, the Park Head and CIMA.  CIMA will \nrecuse itself from all CG meeting items regarding these issues to ensure the impartiality of the review.  \nThis diverse representation provides natural pathways for reporting issues and for providing an \nindependent, third-party review of any issues raised.  Outcomes of the CG reviews will also be provided \nin writing to the submitting individual or community within 30 days. \n \nMinutes of the CG meetings, park guard reports and technician reports will capture the input received \nfrom communities while emails, meeting minutes and phone logs will capture input from primary \nstakeholders.  In addition, reports to funders will often summarize much of the same information.  All of \nthis information will feed into the ICC system to provide data on new threats (illegal activities, tensions \nbetween communities), suggestions or other issues.  As appropriate, CIMA’s strategies and activities will \nbe adjusted better to achieve the project’s goals.  Immediate threats may result in immediate changes in \nactivities and will not require a quarterly ICC review.  The ICC documentation and quarterly project \nreports will capture how the plan has been revised as a result of stakeholder dialogues.   \n \nOnce the regional community meetings have occurred in 2008 and early 2009, a summary document will \nbe prepared in conjunction with the new Plan Maestro documenting this input process, its results, and \nhow the project has been developed in line with this input."}, {"uid": "c004", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D1", "paragraph_id": "p96-23", "page": 96, "text": "Is the project receiving or seeking credit for reductions and removals from a project activity \nunder another GHG programme, or any other form of community, social, or biodiversity unit or \ncredit?"}, {"uid": "c005", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q4", "paragraph_id": "x1-p60-11", "page": 60, "text": "- \nPost construction monitoring activities will include status of muck disposal areas, borrow pits \nand landfill sites.  Change in land use pattern and effectiveness of CAT plan will be monitored \nusing satellite imageries."}, {"uid": "c006", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "A2", "paragraph_id": "p5-03", "page": 5, "text": "1. Piping, valves and controls for (a) conveying LFG from the District Facilities to the Project’s LFG \nprocessing equipment and (b) conveying any excess or otherwise unused LFG to the District \nFacilities for destruction in the District’s existing LFG flare \n2. A LFG processing system and related ancillaries and controls for conditioning the delivered LFG \nby removing moisture, and other contaminants prior to use of the LFG in the Project’s electric \npower generating equipment.  The moisture and contaminants are conveyed directly to the \nDistrict’s discharge piping to the New Bedford waste water treatment facility. \n3. Electric power generating equipment, including four Caterpillar model 3516 engine-generator sets \nand related ancillaries and controls for combusting the processed LFG fuel to produce \nmechanical energy for generating electric power \n4. Switchgear, transformers, relays and related controls and equipment for delivering the electric \npower to the local distribution utility,  Eversource Energy (formerly known as NSTAR) \n5. Buildings, enclosures, foundations, access-ways, fencing and related utilities and civil structures \nnecessarily associated with the above \n \nThe Project has the capacity to combust up to 40.2 MMBtu per hour or 1,326 scfm of LFG at 50 percent \nmethane.  Combustion of the LFG fuel in the engines creates mechanical shaft power that turns \nappropriately-matched electrical generators to generate up to 3.3 MW (net) of electricity.  The capacity of \nthe Project is based on the use of four Caterpillar model 3516 engine-generator sets rated nominally at \n825 kW (gross) per set.  Caterpillar internal combustion engine technology and its competitive analogs \nare widely available and have a long record of successful use in LFG applications over many decades \nand under a wide range of operating conditions.  Electricity generated at the Project is delivered to the \nregional power grid via an interconnection with the local electricity distribution company, Eversource \nEnergy (formerly known as NSTAR).  Waste heat from the generation of electricity is sold to an anaerobic \ndigestion facility off-site. \n \nWhile the specific age of each piece of Project equipment varies, all electricity generation plant equipment \nwas new and installed prior to the generation system becoming operational in November 2005.  No \nequipment associated with the Project is scheduled to be replaced within the second crediting period \nbased on its anticipated lifetime.  Routine maintenance will be conducted in accordance with the \nmanufacturer’s recommendations.   \n \nEquipment and piping associated with the LFG collection system range in age from the District Initial \nSystem installed in 2000 to the expanded system installed between 2002-2015.  Wells in older portions of \nthe Landfill may be closed due to decreasing methane levels.  If well replacement is needed, similar \nmaterials will be used and the efficiency or capacity of the well or piping will not be changed.  As of 2015, \n11 of the original District Initial System wells had been closed.  The original flare installed in 2000 is still in \noperation and is expected to require only routine maintenance over the second crediting period.   \n \nAppendix 1 provides a site plan and general arrangement of the Project.  The pictures below show some \nof its components."}, {"uid": "c007", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "P2", "paragraph_id": "p25-02", "page": 25, "text": "1.11 Identification of risks that may substantially affect the project’s GHG \nemission reductions or removal enhancements: \n \nNon-permanence risk assessment was carried out using the VCS’  “AFOLU Non-\nPermanence Risk Tool” version 3 of 8 March 2011.  According to this tool, the \nproject activity was rated at a low risk after yielding a 8.5% of buffer requirement. \nThe project has a system in place to identify risks and established targets to \nreduce any non-permanent risks. Procedures have been developed and \nresponsibilities are well assigned with internal auditing, reviews and training in \nplace.  The project also has a well qualified, experienced local management team \nin place to ensure that the project activities are implemented effectively.  The land \nplanned for the project activity is wholly contained within a national park.  Based \non the Sections 3,4 and 5 of the Uganda Wildlife Statute, the national park is fully \nowned by the government of Uganda under the UWA Act and mandated by \nUganda Wildlife Authority on behalf of Uganda government and all Ugandans. \nTherefore, UWA has full control over the entire project lands. Additionally, the \nproject will hold a 10%  VCS buffer in reserve for use in case of any loss of \npermanence.   \n \nReference is hereby made to the detailed VCS report called  “Non-Permanence Risk \nReport: Natural High Forest Rehabilitation Project on degraded land of Kibale \nNational Park” for more information.   \n \n \n1.12 Demonstration to confirm that the project was not implemented to \ncreate GHG emissions primarily for the purpose of its subsequent \nremoval or destruction.  \n \n At the time the project started, in 1995, carbon credits were not a commodity and \nthe concept was unheard of. Face became involved in 1994 and did not invest in \nforest destruction but in forest restoration. Instead, deforestation that took place \nin the UWA-Face project area was as a result of  encroachment by local  \ncommunities in the period between 1970 and 1985 (Okonya, 1993). For almost  30 \nyears local communities were farming within the Forest Reserve, grazing cattle, \ngrowing maize and bananas. There was no productively managed forest in the \narea. In 1993 all inhabitants and encroachers within the boundaries of the National \nPark were were re-settled  in Kibaale District,  approximately 100 km from Kibale \nNational Park (FSC, 2010; General Management Plan of Kibale National Park, 2003-\n2013).  These statements are further substantiated by the Figures 1.7.1 and 1.7.2 \npresented earlier in the PD. \n \nThe purpose of the project is to reforest degraded lands and to promote natural \nregeneration. The project was not implemented to create GHG emissions hence \nno clearing of forest for creation of VCU’s took place.  \n \n1.13 Demonstration that the project has not created another form of \nenvironmental credit (for example renewable energy certificates)."}, {"uid": "c008", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "A1", "paragraph_id": "p100-26", "page": 100, "text": "VT0001 Tool for the demonstration \nand assessment of additionality in \nVCS agriculture, forestry and other \nland use (AFOLU) project activities"}, {"uid": "c009", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "P1", "paragraph_id": "p57-16", "page": 57, "text": "Field and classroom based \ntraining on organizational \nmanagement, strategy, \nequipment use, resource \nmobilization, risk \nassessment and \ncommunication."}, {"uid": "c010", "project_id": "VCS1851", "project_name": "Renewable Solar Power Project by ReNew Solar Power Private Limited", "question_id": "Q1", "paragraph_id": "p61-02", "page": 61, "text": "The metering arrangement, accuracy class of meters, calibration \nfrequency is under control of state electricity board and PP do not \nhave any control on it. PP is getting value of net electricity \nsupplied to grid and the same is considered the monitoring \nparameter.  \n \nThe billing is raised based on substation meters. \nPurpose of data \nCalculation of baseline emissions"}, {"uid": "c011", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A2", "paragraph_id": "p40-05", "page": 40, "text": "Stepwise approach for common practice analysis has been carried out as per Methodological tool \n“Common Practice”, version 03.1 EB84, Annex 7: \n \nStep (1): Calculate applicable capacity or output range as +/-50% of the total design capacity or \noutput of the proposed project activity."}, {"uid": "c012", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "S1", "paragraph_id": "p23-06", "page": 23, "text": "i. \nOnline \nmeeting, \n22/01/2021 \nii. \nWebinar, \n22/04/2021 \niii. \nSedawa \nMunicipal Hall, \n11/05/2021 \niv. \nLulekani \nMunicipal Hall, \n12/05/2021 \nv. \nBrooklyn \nNazarene \nChurch, \n13/05/2021 \nvi. \nMnisi \nTribal \nHall, \n14/05/2021"}, {"uid": "c013", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S2", "paragraph_id": "p56-05", "page": 56, "text": "The project is currently in the process of formalising redress mechanisms for any potential grievances \narising from project zone communities or other stakeholders. In the community context, procedures are \nbeing developed in a participatory manner through dialogues during community engagement activities. \nWhilst they are yet to be finalised and formally adopted by all parties, and draft procedures to redress \ngrievances consist of the following steps:"}, {"uid": "c014", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A1", "paragraph_id": "p69-15", "page": 69, "text": "Equity IRR without CDM \nBenchmark (Equity IRR) \nFinal Results \n8.69% \n15.32%"}, {"uid": "c015", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "Q1", "paragraph_id": "p50-20", "page": 50, "text": "Efwf,CO2 \ntCO2e/TJ \n112 \nCO2 emission factor of \nbiomass that is substituted \nor reduced"}, {"uid": "c016", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "P1", "paragraph_id": "p241-16", "page": 241, "text": "A non-permanence risk assessment was carried out in accordance with the most recent AFOLU \nNon-Permanence Risk Tool v.4.2 and the Risk Assessment Calculator. The resulting risk rating \nand non-permanence risk buffer is 14%. This assessment primarily addresses the risk to climate \nbenefits but is equally applicable to the risks associated with community and biodiversity \nbenefits."}, {"uid": "c017", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q2", "paragraph_id": "p9-13", "page": 9, "text": "Project does not involve any leakage emissions other than methodology requirement for hydro \npower project. Hence there are no any extra Leakage Management Plan and risk mitigation \nmeasures are required."}, {"uid": "c018", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "A2", "paragraph_id": "p42-07", "page": 42, "text": "The baseline scenario was determined for the first baseline period as industrial forestry (typically \nplanting monoculture acacia) plantation and remains the most credible scenario for the second \nbaseline period. Please see Section 3.1.4 for the detailed justification.  \n \nConversion of the forest area to oil palm plantations was also considered as a baseline scenario.  \nOil palm remains one of the most common non-forest commodity industrial land uses of lowland \npeatlands in Indonesia, despite the fact that peat soils are not ideal for its cultivation. The area of \noil palm plantations in Indonesia has increased dramatically over the past decades \n(https://ipad.fas.usda.gov/highlights/2023/11/Indonesia/index.pdf), \nincluding \nin \nCentral \nKalimantan, although almost exclusively in areas legally outside of the forest estate (designated \nas APL or Other Land Utilization) or within the forest estate in areas ear-marked for conversion \n(designated HPK or Conversion Forest).  \n \nOil palm cannot legally be established on land designated as production forest. It can only be \nestablished legally by first excising the area from the forest estate as regulated under Government \nDecree PP No. 60/2012. However, this is only possible in forest areas designated as Conversion \nProduction Forest (Hutan Produksi Konversi or HPK)."}, {"uid": "c019", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "Q2", "paragraph_id": "p155-03", "page": 155, "text": "Applying this value to equation 20- and using activity leakage of zero, this leads to the following \nresults for the leakage calculation as shown in Table 31."}, {"uid": "c020", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q1", "paragraph_id": "p46-11", "page": 46, "text": "EFgrid,CM,y= EFgrid,OM,y* WOM+ EFgrid,BM,y* WBM"}, {"uid": "c021", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "A4", "paragraph_id": "x1-p13-07", "page": 13, "text": "B.4. \nDescription of how the  baseline scenario is identified and description of the identified \nbaseline scenario:  \n \n>> \nAs the project activity is the installation of a new grid-connected hydro power plant/unit, as per \nACM0002, Version 12.1.0, the baseline scenario is the following: \nElectricity delivered to the grid by the project activity would have otherwise been generated by the \noperation of grid-connected power plants and by the addition of new generation sources, as reflected in \nthe combined margin (CM) calculations described in the “Tool to calculate the emission factor for an \nelectricity system” (Version 02) described step wise under section B.6. \n \nB.5. \nDescription of how the anthropogenic emissions of GHG by sources are reduced below \nthose that would have occurred in the absence of the registered CDM project activity (assessment \nand demonstration of additionality):  \n>> \nAs per the decision 17/cp.7, paragraph 43, a CDM project activity is additional if anthropogenic \nemissions of green house gases by sources are reduced below those that would have occurred in absence \nof registered CDM project activity. The methodology requires the project proponent to determine the \nadditionality based on ‘Tool for the demonstration and assessment of additionality’, Version 05.2. The \nstep-wise approach to establish additionality of the project activity as per the additionality tool is \nprovided below. \n \nPrior Consideration of CDM: \n \n“Guidance on the demonstration and assessment of prior consideration of the CDM” (EB49, Annex 22), \nstates that for project activities with a start date before 2nd August 2008, for which the start date is prior \nto the date of publication of the PDD for global stakeholder consultation, the serious consideration of \nCDM in the decision to proceed with the implementation of the project activity is to be demonstrated. \nThe following elements demonstrate project proponent’s serious consideration of CDM: \n \na) During the project evaluation in June 2003, the JKHCL Board considered the necessity of CDM"}, {"uid": "c022", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q2", "paragraph_id": "p35-11", "page": 35, "text": "Alternative 2: No proposed project activity and equivalent amount of energy would have \nbeen produced by the grid electricity system through its currently running power plants \nand by new capacity addition to the grid i.e. Continuation of the present situation. \n \nThe PP would have continued without investment in Project activity with usual business activities. \nThe grid would continue with the fossil fuel based power projects and this would result in GHG \nemissions. Hence, the new capacity add-on from a fossil fuel based power plant is appropriate, \nrealistic & credible baseline alternative for the project activity. \n \nOutcome of Sub-step 1a: All the realistic alternatives for the project activity have been enlisted \nabove.  \n \nThus though two alternatives are mentioned above as per step of additionality tool, the first \nalternative is not possible as project activity is not viable without carbon credit benefits and \nsecond alternative is the baseline scenario for the project activity as per methodology as \nmentioned in section 2.4 of joint VCS PD & MR. \nIt is to be noted that being the green field project activity, “the baseline scenario is electricity \ndelivered to the grid by the project activity would have otherwise been generated by the operation \nof grid-connected power plants and by the addition of new generation sources, as reflected in the \ncombined margin (CM) calculations described in the “Tool to calculate the emission factor for an \nelectricity system”."}, {"uid": "c023", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "S2", "paragraph_id": "p24-08", "page": 24, "text": "3. SDG-5: Gender Equality \nApproach: In this case, the number of ICS beneficiary HHs will be questioned over their time \nspent for collecting fuel (firewood)."}, {"uid": "c024", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "D2", "paragraph_id": "p21-05", "page": 21, "text": "The project is not included in an emissions trading program or any other mechanism that \nincludes GHG allowance trading."}, {"uid": "c025", "project_id": "VCS1851", "project_name": "Renewable Solar Power Project by ReNew Solar Power Private Limited", "question_id": "A1", "paragraph_id": "p118-21", "page": 118, "text": "Equity IRR without CDM \nBenchmark (Equity IRR) \n9.51% \n15.32%"}, {"uid": "c026", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "D2", "paragraph_id": "p26-02", "page": 26, "text": "NOT APPLICABLE. \n \n1.14 Project rejected under other GHG programs (if applicable): \n \nNOT APPLICABLE. \n \n1.15 Project proponents roles and responsibilities, including contact \ninformation of the project proponent, other project participants: \n \nFace the Future is a company that was set up with the mission to mitigate climate \nchange by rehabilitating and conserving forests and other ecosystems. Its \npredecessor is Face Foundation (FACE: Forests Absorbing Carbon-dioxide \nEmissions), a Dutch Foundation that was established with the objective to \ndevelop afforestation and reforestation projects in order to combat climate \nchange. The projects that Face Foundation had established are located in \nMalaysia, Ecuador, Uganda, the Czech Republic and the Netherlands. In 2009 Face \nFoundation transferred her projects to Face the Future. This document refers to \nFace the Future’s project activity in the Kibale National Park in Uganda. \nThe Uganda Wildlife Authority (UWA) is one of the governing bodies that \nregulates wildlife conservation in Uganda. UWA was established in 1996 by the \nUganda Wildlife Statute, which merged the Uganda National Parks and the Game \nDepartment. It is governed by a Board of Trustees appointed by minister \nresponsible for wildlife. UWA is in charge of management of 10 National Parks, 12 \nWildlife Reserves, 14 Wildlife Sanctuaries and provides guidance for 5 Community \nWildlife Areas. UWA's mission is to conserve, economically develop and \nsustainably manage the wildlife and Protected Areas of Uganda in partnership \nwith neighboring communities and stakeholders for the benefit of the people of \nUganda and the global community. \n \nTable 1.15.1 Outline of the project proponents and participants for the Kibale ARR \nproject activity."}, {"uid": "c027", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "Q3", "paragraph_id": "p152-04", "page": 152, "text": "4.3.3 \nEmissions due to deforestation and natural disturbance \nForest cover change due to deforestation and natural disturbance is monitored through periodic \nassessment of classified satellite imagery covering the project area. Emissions (ÄCP,Def,i,t and ÄCP,DistPA,i,t \nfor deforestation and natural disturbance, respectively)  are estimated by multiplying area of forest loss \ndetected (ADefPA,u,i,t and ADistPA,q,i,t, for deforestation and natural disturbance, respectively) by average \nforest carbon stock per unit area (conservatively assuming ÄCP,Dist,q,i,t and ÄCpools,Def,u,i,t  = CBSL,i). Stock \nestimates from the initial field inventory completed in 2009, are valid for 10 years (per VM0007), minimally \nthrough 2018. Post 2018, forest carbon stock estimates will be updated for any strata where deforestation \nor natural disturbance is detected.  \n \n \n4.3.3.1 \nMonitoring changes in forest cover \nThe project boundary, as set in the PD, will serve as the initial “forest cover benchmark map” against \nwhich changes in forest cover will assessed over the interval of the first monitoring period; the entire \nproject area has been demonstrated to meet the forest definition at the beginning of the crediting period. \nFor subsequent monitoring periods, change in forest cover will be assessed against the preceding \nclassified forest cover map marking the beginning of the monitoring interval. \n \nData collection and analysis to determine forest cover change at each monitoring event will follow the \nprocedures detailed below. The resulting classified image is compared with the preceding classified \nimage (forest cover benchmark map marking the start of the monitoring interval) to detect forest cover \nchange over the monitoring interval, and subsequently becomes the updated forest cover benchmark \nmap for the next monitoring interval. Thus, the forest benchmark map is updated at each monitoring \nevent. All changes in forest cover detected for the monitoring interval will be annualized (to produce \nestimates of ha for each year) by dividing the area by the number of years in the period. \n \nFor each monitoring/verification date, satellite imagery for that year will be acquired and interpreted to \nproduce a classified forest cover map in which forest and non forest are distinguished. AMinimum \nMapping Unit (MMU) of 0.81 ha, corresponding to 3pixels by 3 pixels Landsat resolution (90m by 90m) \nwill be used throughout the duration of the project crediting period. \n \nThe general work flow for monitoring forest cover change is shown in Figure 4.1. \n \nFigure 4.1: General workflow for monitoring of forest cover change in the project area and leakage belt"}, {"uid": "c028", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "Q1", "paragraph_id": "p122-02", "page": 122, "text": "project will be captured for heat generation and all the heat generated from this project will be \nused by the daily operation of AWMS and the 9 swine farms. The heat generated is not connected \nto another user. So, the baseline CO2 emission from electricity and/or heat used in the baseline \nis 0, which is conservative. So, 𝐵𝐸𝑦= 𝐵𝐸𝐶𝐻4,𝑦+ 𝐵𝐸𝑁2𝑂,𝑦 ."}, {"uid": "c029", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "A2", "paragraph_id": "p42-06", "page": 42, "text": "***) The part of the Development Area studied by Meijer exceeded the area implemented; the \ntypes listed by Meijer also includes riverine vegetation, and other vegetation outside the \ncompartment area. \n \nSTEP 3. Investment analysis \n \nWas not carried out for this ARR project activity because the baseline scenario \nidentified in sub-step 2c above allows for the highest baseline GHG removals by \nsinks.  \n \nSTEP 4. Common practice analysis \nThere are a couple of projects being implemented in other regions of Uganda. The \nfirst is a small scale reforestation project in Rwoho Central Forest Reserve of the \nNile Basin. The Rwoho project was the first ever Ugandan project to be registered \nunder CDM. It is part of a project cluster of 5 similar projects aiming to provide a \nnew financing mechanism to overcome the current barriers to establish timber \nplantations in Uganda and to allow communities to benefit from the CDM. In total \nthe project activities cover an area of 347.1 ha within Rwoho Central Forest \nReserve (NFA planting area: 324.9 ha (94 %), community planting area: 22.2 ha (6 \n%). The Reserve covers in total an area of 9,100 ha. Based on conservative \nestimates, with a 22 years rotation cycle for all tree species, the project will \nproduce 24,421 tCO2-e by 2012. The project allows the involvement of private and \ncommunity-based tree planting initiatives with different investor shares. Due \ndiligence, monitoring, validation and verification costs will be shared among the \nproject cluster. Based on a successful implementation of the first pilot cluster it is \nplanned to extend the portfolio across the country clustered in a number of \ndeforested public forest reserves and target regions. Hence, a project design that \ncan be easily replicated was developed and the concept will consider options for a \nprogrammatic approach. \n \nThe other reforestation activity is the Community Reforestation Project in the \nAlbertine Rift valley region which is currently working with established groups of \nfarmers in the Albertine Rift region of Uganda to plant agroforestry and small"}, {"uid": "c030", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "P3", "paragraph_id": "p20-02", "page": 20, "text": "Chrysophyllum albidum (Sapotaceae family):  A tall and straight evergreen tree \naveraging 50 m in height with a dominant canopy; present in mixed parts of Kibale \nforest.  The leaves are compound (oval-oblong shape) with an albidum (white or \nsilvery - gray) under surface on mature leaves; the species is an intermediate \nrequiring spacious shade when young. \nPropagation: It is propagated from wildings and seeds.   \nUses: fuel wood, timber and food. \n \nCordia africana/abyssinica (Boraginaceae family): A deciduous tree averaging 15-25 \nm in height, often with a crooked trunk. It tolerates a variety of soil types and is \ncommon in moist forests, riverine galleries and wooded grasslands. Leaves are \nlarge (16 cm) and oval in shape, with a rounded base.    \nPropagation: It is propagated from wildlings and seeds.  \nUses: fuel wood, timber, medicine, fodder, bee forage and soil mulch. \n \nCordia mellenii/ugandensis (Boraginaceae family): A large tree measuring 30-45 m \nin height, with a wavy trunk rarely straight and a spreading crown. The leaves are \nlarge (16 x 13 cm) round, alternate with rounded tips and a heart shaped base. \nPropagation: It is propagated from wildings and seeds.  \nUses: timber, carving, fodder, bee forage and soil mulch. \n \nCroton macrostachys (Euphorbiaceae family): A deciduous tree with a rounded \nopen crown formed by large spreading branches.  The leaves are large, soft and \nheart-shaped.  It is a fast growing species in areas with deep soils and high rainfall \n(1,100–2,500 masl). \nPropagation:  It is propagated from primarily seeds, and occasionally from \nwildlings.   \nUses: timber, poles, medicine, folder, soil conservation.  Use as a fuelwood is \nlimited because of the unpleasant spicy odour released from the poisonous sap. \n \nCroton megalocarpus  (Euphorbiaceae family): A semi - deciduous forest tree with \nan average height of 30 m and a light shade crown.  It is widespread in Kibale \nforest mostly in semi - humid habitats of 100–2,500 masl.  It is fast growing in \nareas with deep soils.  Its leaves are of variable sizes, with a dull green upper \nsurface and pole silvery underside. \nPropagation:  It is propagated through direct sowing of seeds in pots.   \nUses: timber, medicine and fuel wood. \n \nDiospyros mespiliformis: A medium to large tree up to 25 m in height with a grey \nbark, which is rough and squared. Its leaves are a shiny dark green and alternate. \nIts flowers are fragrant: male flowers are clustered while female flowers are \nsolitary. The resulting fruit is rounded in shape to 2-5 cm in a calyx cup, yellow and \nlater purple.  The pulp is soft and sweet with brown, hairy seeds. The wood is \nblack and pale after felling. \nPropagation: It is propagated from seedlings and wildlings. \nUses: Firewood, charcoal, timber, food (fruit; dry, fresh, fermented drink), \nmedicine (bark, roots, fruits) bee forage shade and ornamental."}, {"uid": "c031", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "A1", "paragraph_id": "p41-10", "page": 41, "text": "(b) Comparison of the project IRR for the project and the benchmark following table.  \nWithout income from selling VCUs, the IRR of the project is 5.38%, lower than the benchmark IRR \n9.5% and the project is financially unacceptable because of its low profitability. While considering \nsuch income, the IRR of the project is 10.69%, higher than the benchmark, and the project is \nfinancially acceptable."}, {"uid": "c032", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "Q1", "paragraph_id": "p123-13", "page": 123, "text": "Equation for calculating net CO2 emissions due to unplanned deforestation displaced from the project \narea to the leakage belt (Equation 1 from LK-ASU Module):"}, {"uid": "c033", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "D2", "paragraph_id": "x1-p32-01", "page": 32, "text": "PROJECT DESIGN DOCUMENT FORM (CDM PDD) - Version 03 \n \nCDM – Executive Board  \n \n \n \n \n \n \n \n \npage 32 \n \n \nOutcome of Step 2: \nIt can be justifiably concluded that the CDM revenues which the project activity would generate through \nsale of the emission reductions is very crucial to sustain the operations of the project activity. The returns \nfrom the project after considering CDM revenues give a project IRR of 11.54%. Thus, with CDM \nbenefits the project becomes financially attractive in as much as the project IRR crosses the benchmark.  \n \nHence the project is additional. \n \n \nStep 3: Barrier Analysis:  \n \nSub-step 3a: Identify barriers that would prevent the implementation of the type of the proposed project \nactivity \n \nThe project proponent has not opted for Barrier Analysis to demonstrate additionality for the project \nactivity.  \n \nStep 4: Common practice analysis \n \nSub-step 4a: Analyze other activities similar to the proposed project activity: \n \nThe re-assessment studies of hydro-electric potential of the country, completed by CEA in 198729, have \nassessed the economically exploitable hydro power potential as 84,04430 MW at 60% load factor. As on \n31.03.2007, the hydro-electric schemes in operation account for only 20.32% and those under execution \nfor 5.18% of the total potential at 60% Load Factor. Thus, the bulk of the potential (74.50%) remains yet \nto be developed. \n \nThe All-India aggregate installed capacity of electric power generating stations under various utilities as \non 31.3.2007 was 132329.21 MW comprising 34653.77 MW of hydro, 86014.84 MW of thermal, 3900 \nMW of nuclear and 7760.60 MW of Renewable Energy Sources (RES). The percentage share of hydro, \nthermal, nuclear and RES of the total installed capacity stood at 26.1931%, 65%, 2.95% and 5.86% \nrespectively. \n \nIndia has for many years faced severe power shortages. Currently, at the time of peak demand, power \nshortages are estimated to be about 12%, while annual energy shortages are nearly 7% of demand32. \nThese shortages are likely to continue and increase in the foreseeable future, even with the planned \nadditions in generation capacity. Analysis shows that the gap in supply (after considering the impact of \nprice elasticity on demand) can be only marginally reduced by loss reduction and efficiency gains. The"}, {"uid": "c034", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q3", "paragraph_id": "x1-p45-04", "page": 45, "text": "- \nWind and solar power generation project activities: wOM = 0.75 and wBM = 0.25 (owing to their \nintermittent and non-dispatchable nature) for the first crediting period and for subsequent \ncrediting periods.  \n- \nAll other projects: wOM = 0.5 and wBM = 0.5 for the first crediting period, and wOM = 0.25 and \nwBM = 0.75 for the second and third crediting period, unless otherwise specified in the approved \nmethodology which refers to this tool.  \n \nAs mentioned before, the CEA has calculated the baseline emission factors for various regional grids in \nIndia according to the formulas specified above. As this is the most authentic information available in the \npublic domain. The baseline emission factor used in the calculation of baseline emissions for the \nproposed project activity is being referred from the same for transparency and conservativeness41. \n \nProject activity emissions"}, {"uid": "c035", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D3", "paragraph_id": "p80-04", "page": 80, "text": "o \nRegular Audits and Monitoring: Continuous internal and third-party audits are conducted \nto ensure compliance with forestry, peatland, and environmental standards \no \nCarbon Offset Reporting and Verification: Emission reduction calculations undergo \nthorough verification in line with the national carbon trading framework, ensuring \ntransparency in reporting and alignment with Indonesia’s NDC targets \no \nGrievance and Environmental Impact Management: Adhering to Ministry of Environment \nregulations, the project has established grievance redress mechanisms to address \nconcerns about environmental degradation and pollution \no \nTraining and Capacity Building: The project involves local communities in forest \nmanagement and fire suppression efforts, which aligns with Ministry of Forestry and \nregional regulations on community engagement."}, {"uid": "c036", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "A2", "paragraph_id": "p44-02", "page": 44, "text": "3.5 \nAdditionality \nAdditionality for the project activity is demonstrated using Tool 02 Combined tool to identify the \nbaseline scenario and demonstrate additionality (Version 07.0). Step 1-3 were already done in \nsection 3.4 of this JPM. \nAs per Tool 24 Common practice (Version 03.1), Step 4 common practice analysis will be \nconducted as follows: \n \nStep 4: Common practice analysis"}, {"uid": "c037", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q2", "paragraph_id": "x1-p46-10", "page": 46, "text": "(W). For new hydro power plants, this value is zero. \nAPJ  \n= Area of the reservoir measured in the surface of the water, after the implementation of the \nproject activity, when the reservoir is full (m2). \nABL  \n= Area of the reservoir measured in the surface of the water, before the implementation of the \nproject activity, when the reservoir is full (m2). For new reservoirs, this value is zero. \n \nLeakage \nAccording to ACM0002, the main emissions potentially giving rise to leakage in the context of electric \nsector projects are emissions arising due to activities such as power plant construction, fuel handling \n(extraction, processing, and transport), and land inundation (for hydroelectric projects). Project \nparticipants do not need to consider these emission sources as leakage in applying this methodology. \nProject activities using ACM0002 shall not claim any credit for the project on account of reducing these \nemissions below the level of the baseline scenario. Thus the leakage emissions are nil."}, {"uid": "c038", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "Q1", "paragraph_id": "p19-03", "page": 19, "text": "4.4 \nNet GHG Emission Reductions and Removals \nGHG Emissions reductions are calculated by subtracting the Project emissions from the baseline \nemissions removals.  \n \nERy = BEy – PEy             (17) \n \nWhere: \nERy = Emission reductions in year y (tCO2e/yr) \nBEy = Baseline emissions in year y (tCO2e/yr) \nPEy = Project emissions in year y (tCO2/yr) \n \n \nEstimated emissions reductions are provided below and the calculation spreadsheet is provided in \nAppendix 2."}, {"uid": "c039", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S3", "paragraph_id": "p39-13", "page": 39, "text": "Human-induced risks to the \nproject’s biodiversity benefits, \nboth in the short and long-term, \nare essentially the same to those \nrelated to climate change benefits \n(above) as they relate to the \nprotection and regeneration of the \nnatural ecosystem. In addition, \nthere are further human-induced \nrisks related to hunting pressure, \ntypically focused on a narrow \nrange of species."}, {"uid": "c040", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "A1", "paragraph_id": "p33-02", "page": 33, "text": "Therefore, the impact of the stoves will be \nassessed at the sub-national level in accordance \nwith each PI description, and not at the national \nlevel as the commenter suggests. \n \nAdditionally, the National GHG Inventory, \nreferenced in the public commentary, references \nstudies that were published in 2013 and earlier. \nThe socio-economic situation, the affordability of \nelectricity and population density in rural areas in \nSouth Africa has changed considerably in the last \neight years and has since also been exacerbated \nby the global Covid-19 pandemic151617.  \n \nAccording to the Global Forest Watch platform, \nSouth Africa lost 1.48 Mha of tree cover from 2001 \nto 2020, equivalent to a 25% decrease in tree \ncover since 2000. The Global Forest Watch also \nreported that in 2020 alone, South Africa lost \n30.3kha of natural forest.18 \n \nAlthough South Africa’s forestry sector is well \ndeveloped, the heavy dependency of the rural \npoor in South Africa on forest resources is \nexerting pressure on indigenous forests and \nwoodlands2. The unsustainable harvesting of \nfuelwood has resulted in forest degradation, loss \nof millions of hectares of forest (deforestation) and \ndesertification. The annual deforestation rate in \nSouth Africa is estimated to be 0.2 percent.” 19"}, {"uid": "c041", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A2", "paragraph_id": "p42-05", "page": 42, "text": "Thus, the proposed project activity is not a “common practice” within a sector in the \napplicable geographical area."}, {"uid": "c042", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "S2", "paragraph_id": "p32-05", "page": 32, "text": "7 \nSTAKEHOLDER COMMENTS \nThe Project stakeholders are the District and CNBE.  There are no other investment group or public \ngroups involved in the Project.  Therefore, no formal stakeholder consultations are required.  However, \nthe District does have a formal process for receiving comments or complaints available to the public via \nemail or telephone.  No comments regarding this Project have been received.  In addition, the District \nCommittee, which is an oversight committee comprised of representatives of the District’s member \ncommunities and which makes strategic decisions for the District, meets once per month and the \nmeetings are open to the public."}, {"uid": "c043", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q4", "paragraph_id": "p33-02", "page": 33, "text": "In the absence of the project activity, the equivalent amount of power would have been drawn \nfrom the Indian grid. Hence, the baseline for the project activity is the equivalent amount of \npower from the Indian grid.  \n \nThe combined margin (EFgrid, CM,y) is the result of a weighted average of two emission factor \npertaining to the electricity system: the operating margin (OM) and build margin (BM). \nCalculations for this combined margin must be based on data from an official source (where \navailable) and made publically available. The CEA database version 12 is the latest available \ndata at the time of PD submission to DOE for validation, hence same is considered for emission \nfactor calculations. \n \nThe combined margin of the Indian grid used for the project activity is as follows:"}, {"uid": "c044", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "D3", "paragraph_id": "p68-08", "page": 68, "text": "The Kuamut Rainforest Conservation Project has not been registered under any emissions trading \nprograms or any program involving environmental or social credits. The project will not claim credit for the \nsame GHG emission reduction under another program."}, {"uid": "c045", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "D2", "paragraph_id": "p68-16", "page": 68, "text": "The Kuamut Rainforest Conservation Project has not applied for or been rejected by any other GHG \nprograms."}, {"uid": "c046", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q4", "paragraph_id": "x1-p60-12", "page": 60, "text": "- \nPost monitoring of environmental indicators like river water quality, sediment transport analysis, \nland use, soil erosion, ecological changes, aquatic life is conducted periodically as per guidelines \nissued by the project monitoring committee.  Frequency of such monitoring with respect to \nparameters will be decided by the Project Monitoring Committee."}, {"uid": "c047", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q1", "paragraph_id": "x1-p40-02", "page": 40, "text": "BEy \n= \nBaseline emissions in year y (tCO2/yr) \nEGPJ,y \n= \nQuantity of net electricity generation that is produced and fed into the grid as a result \nof the implementation of the CDM project activity in year y (MWh/yr) \nEFgrid,CM,y\n= \nCombined margin CO2 emission factor for grid connected power generation in year y \ncalculated using the version 02 of the “Tool to calculate the emission factor for an \nelectricity system”"}, {"uid": "c048", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "A1", "paragraph_id": "p36-06", "page": 36, "text": "No burning of \nbiomass takes \nplace in the \nproject \n \n \n2.4 Description of how the baseline scenario is identified and description \nof the identified baseline scenario:"}, {"uid": "c049", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "S3", "paragraph_id": "p31-10", "page": 31, "text": "No Listed Activities requiring an environmental impact assessment under the National \nEnvironmental Management Act (NEMA, Act 107 of 1998), Environmental Impact"}, {"uid": "c050", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "Q2", "paragraph_id": "p48-16", "page": 48, "text": "A net gross leakage factor of 0.95 is applied to ERy,i,j."}, {"uid": "c051", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S1", "paragraph_id": "p208-09", "page": 208, "text": "Through the socio-economic survey, the project team was able to identify the priorities that members \nof the communities in the Karamuak and Kuamut clusters which will be supported by the project \nactivities. These could include providing training and capacity building for developing potential \necotourism community enterprises, support in identification of access to markets and facilitating small \nprocessing facilities for adding value to handicrafts. More specific activities will be developed for \nsupporting improving agricultural practices, such as promoting sustainable palm oil cultivation \nprotocols within farmers dedicated to oil palm production and promotion of smart agriculture \ntechniques among other project interventions aimed to improve livelihoods of agriculture-dependent \ncommunities in the project zone."}, {"uid": "c052", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "S3", "paragraph_id": "p41-03", "page": 41, "text": "enhanced legal protection from the state as the global importance of the stored carbon stocks and \nbiodiversity are fully recognised as a result of the project. In parallel the actions of the project to restore \ndegraded areas will result in the project area being more resilient to the threat of fire. Similarly, activities \ntargeting community benefits are all designed to be managed in the future by the local communities \nthemselves, without the need for further external interventions. Finally, the project itself is anticipated to set \nan example of sustainable land use management in the region, leading to wider adoption of the practices it \nis pioneering. In this way the Kuamut Rainforest Conservation Project will contribute to wider region \nmanaged more sustainably with respect to carbon emissions, biodiversity conservation and equitable \ndevelopment of local communities."}, {"uid": "c053", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "S4", "paragraph_id": "p29-03", "page": 29, "text": "Prior to commencing the project, DelAgua signed a Memorandum \nof Understanding with Ministry of Environment to distribute \nimproved cookstoves to rural households across Rwanda. \nFollowing this, DelAgua has signed Collaboration Agreements with \nthe districts that the project has been delivered in (to date.) These \nagreements help the population in protecting the environment by \nscaling down firewood consumption while reducing indoor air \npollution leading to improved respiratory health. \nPrior to distribution all potential ICS recipients are gathered to \nintroduce the project. They are invited to receive a ICS free of \ncharge. All recipients must consent to receive an ICS by attending \na distribution day and signing the agreement on the bottom of the \nDelAgua poster. \nOutcome of FPIC \nThe FPIC process ensured that all stakeholders were fully informed \nbefore establishing a transparent agreement. Beneficiaries \nvoluntarily agreed to transfer carbon credit ownership at the time of \nICS distribution. The project did not encroach on land, relocate \npeople, or cause physical or economic displacement. Instead, it \nprovides ICS for clean cooking, creates job opportunities, and \nimproves health and environmental outcomes. The Project \nProponent (PP) retains full and uncontested rights to the carbon \ncredits generated from the use of project ICS."}, {"uid": "c054", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "D3", "paragraph_id": "p22-03", "page": 22, "text": "☐   Yes \n \n \n ☒   No \n1.16.2 Registration in Other GHG Programs \nHas the project registered under any other GHG programs?"}, {"uid": "c055", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "D2", "paragraph_id": "p45-02", "page": 45, "text": "(b) The project applies the same measure as the proposed project activity;  \n \nAs described above, the project installs new AWMSs to treat the manure from 9 existing swine \nfarms, which can avoid methane emissions generated in the baseline uncovered anaerobic \nlagoons. And the measure of the project belongs to “Methane formation avoidance” as per Tool \n24“Common practice (version03.1).  \n \n(c) The projects use the same energy source/fuel and feedstock as the proposed project activity, \nif a technology switch measure is implemented by the proposed project activity;  \n \nThe project is to treat the manure from the 9 existing swine farms avoid methane emissions \ngenerated in the baseline uncovered anaerobic lagoons through installing new 9 set of AWMSs. \nThe biogas captured for heat generation, which is used for swine farms. \n \n(d) The plants in which the projects are implemented produce goods or services with comparable \nquality, properties and applications areas (e.g., clinker) as the proposed project plant;  \n \n699,486 tons of animal manure waste can be treated annually and the biogas captured for heat \ngeneration.  If the similar projects can treat the manure waste and produce heat should be \nconsidered as the comparable service. \n \n(e) The capacity or output of the projects is within the applicable capacity or output range \ncalculated in Step 1;  \n \nBased on the calculation in Sub-step 4a.1, the output/capacity ranges of similar project are that \ncan handle manure from 349,743 tons to 1,049,229 tons annually. \n \n(f) The projects started commercial operation before the project design document (CDM-PDD) is \npublished for global stakeholder consultation or before the start date of proposed project activity, \nwhichever is earlier for the proposed project activity.  \n \nThe similar project stared commercial operation before the start date of the project at 05-August-\n2020, which is earlier date. \n \nBased on above analysis, it can conclude the project belonging to “Methane formation avoidance” \nwith treatment of manure operated before 05-August-2020, that can handle manure from \n349,743 tons to 1,049,229 tons annually in Henan Province is the similar project as the project \nactivity."}, {"uid": "c056", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "S3", "paragraph_id": "p34-05", "page": 34, "text": "The ICSs decreases the GHG emission levels \nattributed to improved performance and \ndesign of the project ICSs. It does not involve \nchange in baseline fuel or any other major \ninterventions \nthat \nnegatively \nimpacts \nbiodiversity or ecosystems. Thus, the project \ndoes not affect or alter any largely intact or \nHigh Conservation Value (HCV) ecosystems, \ncritical habitats, landscapes, key biodiversity \nareas or sites identified. \nSoil degradation and \nsoil erosion"}, {"uid": "c057", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "S4", "paragraph_id": "p171-01", "page": 171, "text": "5.1.2 \nBiodiversity Impacts in the Buffer Zone and Offsite \nThis project is devoted to preventing negative biodiversity impacts inside the project area and in the \nsurrounding lands (buffer zone). Project activities themselves will generate positive, not negative impacts \non biodiversity. Work with communities in the buffer zone focuses primarily on land-use stabilization and \nwildlife management. Both efforts benefit native biodiversity outside the park. In addition, stream recovery \nand agroforestry with native species is promoted in the buffer zone as well as reducing hunting pressure \ninside PNCAZ, further benefiting the native biota in the region which in turn benefits the local \ncommunities. For example, “huanganadas” (big herds of peccaries) have been seen entering the buffer \nzone as noted in Table 5.2.  \n \nSimilar positive impacts may also be felt beyond the buffer zone (offsite).  Stream recovery and erosion \nprevention measures will have impacts on biodiversity all along the stream and downstream waters.  \nIncreases in herd size and habitat may allow biota to travel in wider ranges and some locations offsite \nmight also notice increases in biota numbers. \n \nTable 5.2: Wildlife Sightings in the PNCAZ Buffer Zone (Source: CIMA Field Technical Team) \n \nITEM \nDate \nCommunity \nEvent \n1 \n2006 \nNo specific"}, {"uid": "c058", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "S2", "paragraph_id": "p35-02", "page": 35, "text": "The MUF process has evolved over time. For the 2003 MUF, communities elected their local facilitator. \nDepending on the size of the community, more than one facilitator was elected. For example, for the 2003 \nMUF, 53 facilitators, 5% women, were hired for the two month period while for the 2008 MUF, 345 \ncommunity representatives were hired, 19% women. CIMA and The Field Museum personnel trained the \nfacilitators and community representatives on data collection and provided information regarding PNCAZ \nand CIMA. In 2003, facilitators collected data on social organizations and use of natural resources over a \ntwo month period, using community assemblies and household interviews to conduct structured and \nsemi-structured interviews. Eight focus groups were used in each community along with individual \ninterviews: four focus groups included residents of both genders and all age groups, two focus groups \nincluded only women, one group was of community leaders, and one included only specialists or experts \n(e.g., the best hunters). Individual interviews were conducted with health workers, teachers, and directors \nof the local school if one is present, and other significant individuals like shamans, healers, and \ncommunity leaders or founders. In 2008, a change was made to the process to improve data collection \nand workshops were held with community representatives from each geographic area. Three to four \nrepresentatives from each community participated in the process to update the data from the previous \nMUF."}, {"uid": "c059", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "P1", "paragraph_id": "p25-02", "page": 25, "text": "1.11 Identification of risks that may substantially affect the project’s GHG \nemission reductions or removal enhancements: \n \nNon-permanence risk assessment was carried out using the VCS’  “AFOLU Non-\nPermanence Risk Tool” version 3 of 8 March 2011.  According to this tool, the \nproject activity was rated at a low risk after yielding a 8.5% of buffer requirement. \nThe project has a system in place to identify risks and established targets to \nreduce any non-permanent risks. Procedures have been developed and \nresponsibilities are well assigned with internal auditing, reviews and training in \nplace.  The project also has a well qualified, experienced local management team \nin place to ensure that the project activities are implemented effectively.  The land \nplanned for the project activity is wholly contained within a national park.  Based \non the Sections 3,4 and 5 of the Uganda Wildlife Statute, the national park is fully \nowned by the government of Uganda under the UWA Act and mandated by \nUganda Wildlife Authority on behalf of Uganda government and all Ugandans. \nTherefore, UWA has full control over the entire project lands. Additionally, the \nproject will hold a 10%  VCS buffer in reserve for use in case of any loss of \npermanence.   \n \nReference is hereby made to the detailed VCS report called  “Non-Permanence Risk \nReport: Natural High Forest Rehabilitation Project on degraded land of Kibale \nNational Park” for more information.   \n \n \n1.12 Demonstration to confirm that the project was not implemented to \ncreate GHG emissions primarily for the purpose of its subsequent \nremoval or destruction.  \n \n At the time the project started, in 1995, carbon credits were not a commodity and \nthe concept was unheard of. Face became involved in 1994 and did not invest in \nforest destruction but in forest restoration. Instead, deforestation that took place \nin the UWA-Face project area was as a result of  encroachment by local  \ncommunities in the period between 1970 and 1985 (Okonya, 1993). For almost  30 \nyears local communities were farming within the Forest Reserve, grazing cattle, \ngrowing maize and bananas. There was no productively managed forest in the \narea. In 1993 all inhabitants and encroachers within the boundaries of the National \nPark were were re-settled  in Kibaale District,  approximately 100 km from Kibale \nNational Park (FSC, 2010; General Management Plan of Kibale National Park, 2003-\n2013).  These statements are further substantiated by the Figures 1.7.1 and 1.7.2 \npresented earlier in the PD. \n \nThe purpose of the project is to reforest degraded lands and to promote natural \nregeneration. The project was not implemented to create GHG emissions hence \nno clearing of forest for creation of VCU’s took place.  \n \n1.13 Demonstration that the project has not created another form of \nenvironmental credit (for example renewable energy certificates)."}, {"uid": "c060", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "S1", "paragraph_id": "p32-04", "page": 32, "text": "6 \nENVIRONMENTAL IMPACT \n \nIn accordance with the requirements of the Massachusetts Environmental Policy Act (“MEPA”), prior to \nconstruction of the  Project and as a pre-requisite to Project permitting, CNBE submitted an \nEnvironmental Notification Form (“ENF”) to the Massachusetts Secretary of Environmental Affairs to \nenable the Secretary, acting through the MEPA Office (the state agency responsible for assessing the \npotential environmental impact of proposed projects pursuant to MEPA) to determine whether and to what \nextent any detailed environmental impact assessment of the Project should be required.  Based on its \nreview of the ENF, in February 2004 the MEPA Office determined and the Secretary certified that no \nEnvironmental Impact Report for the Project would be required."}, {"uid": "c061", "project_id": "VCS1851", "project_name": "Renewable Solar Power Project by ReNew Solar Power Private Limited", "question_id": "D1", "paragraph_id": "p22-03", "page": 22, "text": "The project has neither been registered nor seeking registration under any other GHG programs. \nThe project is seeking registration only in VCS program."}, {"uid": "c062", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "Q2", "paragraph_id": "p46-08", "page": 46, "text": "Leakage shall be considered as default 0.95 in accordance with Section 8.3 of the applied \nmethodology VRM0006 v1."}, {"uid": "c063", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "A3", "paragraph_id": "p13-03", "page": 13, "text": "3.5 \nAdditionality \nIn accordance with VCS Standard Section 3.8.5.1, a full additionality review is not required for the \nrenewal of the crediting period.  Only regulatory surplus need be demonstrated again and this is \npresented in Section 1.11.  The Project is not required to collect and destroy LFG by any local, regional or \nnational regulation."}, {"uid": "c064", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "Q2", "paragraph_id": "p67-14", "page": 67, "text": "Total for crediting period \n4.615.038 \n \n \n4.4 Quantifying GHG emission reductions and removal enhancements for \nthe GHG project:  \n \nBased on the methodology AR-ACM0001, version 05.0.0, the net anthropogenic \nGHG removals by sinks is calculated with equation (8): \n \nCAR-CDM = ΔCACTUAL – ΔCBSL – LK  \n \nLeakage (LK) is not applicable to the project. The parameter ΔCBSL is quantified in \nSection 4.2 of the PD and ΔCACTUAL is quantified in Section 4.3 of the PD. The Table \n4.4.1 below presents the calculation of the parameter CAR-CDM."}, {"uid": "c065", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "S3", "paragraph_id": "p291-02", "page": 291, "text": "In our commitment to sustainable community engagement and the application of the \nprecautionary principle, we have established measures to mitigate potential negative impacts on \ncommunity well-being, particularly for vulnerable groups such as women, girls, children, and other \nmarginalised populations, as well as for the maintenance and enhancement of high conservation \nvalue (HCV) attributes related to community well-being.  \n \nCurrent and Future Measures for Community Well-being and Environmental Protection  \n \nParticipatory Planning and Consultation \nWe have implemented a participatory planning process, central to which are ongoing \nconsultations with community members. This approach facilitates the early identification and \ndiscussion of potential negative impacts, such as air and noise pollution, water discharges, waste \ngeneration, and the release of hazardous materials. By directly involving community members, \nespecially representatives of vulnerable groups, we ensure that our project design addresses \ntheir unique needs and concerns (UNDP, 2018; IFC Performance Standard 1). This collaborative \napproach promotes shared ownership of both the project and the outcomes, fostering trust and \ntransparency (WHO, 2020). \n \nProactive Risk Assessment and Precautionary Planning \nIn alignment with the precautionary principle (Rio Declaration, 1992), we conduct risk \nassessments that consider both scientifically substantiated risks and potential risks for which \nconclusive evidence may be lacking. This forward-looking strategy prioritises preventive action, \nensuring that we address potential threats to community well-being before they materialise \n(IPBES, 2019). This includes designing strategies to minimise emissions, control waste, and limit \nnoise, as well as implementing spill prevention protocols to protect water quality and prevent \ncontamination (IFC Performance Standard 4). \n \nMonitoring and Responsive Adaptation \nBased on our ongoing monitoring and insights gathered through team interactions with the \ncommunity, no significant adverse effects have been recorded to date. However, we remain \nvigilant. Monitoring systems are in place to identify early signs of potential impacts on community \nwell-being or HCV attributes, allowing us to adapt our strategies as needed (HCV Resource \nNetwork). By prioritising community feedback, we ensure that adjustments are responsive to \nemerging issues or unforeseen challenges (IFC Performance Standard 1). \n \nSafety and Inclusivity Measures for Vulnerable Groups \nSpecific measures to safeguard women, girls, children, and other marginalised groups are \nembedded in our project design (UNDP, 2018). For example, we implement safe worksite \nprotocols (ILO, 1992), maintain accessible communication channels for reporting concerns, and \npromote training programmes on environmental safety and personal security (WHO, 2020). These \nproactive actions provide a secure environment and support community empowerment by \nequipping individuals with knowledge and resources to contribute to and benefit from the project \nsustainably. \n \nAlignment with the Precautionary Principle \nThese measures exemplify our commitment to the precautionary principle, where we prioritise the \nprevention of harm even in the absence of complete scientific certainty (Rio Declaration, 1992). \nOur approach reflects the belief that safeguarding community well-being and protecting \nenvironmental attributes are foundational to achieving sustainable, long-term outcomes (IPBES, \n2019). This forward-thinking stance ensures that the health, safety, and rights of all community \nmembers remain central to our operational philosophy."}, {"uid": "c066", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "P2", "paragraph_id": "p241-16", "page": 241, "text": "A non-permanence risk assessment was carried out in accordance with the most recent AFOLU \nNon-Permanence Risk Tool v.4.2 and the Risk Assessment Calculator. The resulting risk rating \nand non-permanence risk buffer is 14%. This assessment primarily addresses the risk to climate \nbenefits but is equally applicable to the risks associated with community and biodiversity \nbenefits."}, {"uid": "c067", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "Q3", "paragraph_id": "p340-07", "page": 340, "text": "The Katingan Mentaya Project employs a comprehensive biodiversity and forest monitoring \nframework to assess and enhance conservation outcomes. Indicators for carbon monitoring, \nincluding field plot data and remotely sensed imagery, track natural forest regeneration, which \nserves as a proxy for forest quality and its suitability to support RTE species. Additionally, line \ntransect surveys, camera trapping, and opportunistic observations are used to document RTE \nspecies. While these methods are not designed to provide precise population density estimates, \nthey are both cost-effective and feasible, offering valuable insights into species presence and \nrelative abundance indices. \n \nKey species monitoring includes ground nest surveys for Bornean Orangutan (Pongo pygmaeus), \nthe project’s key trigger species, to track population trends over time. Plans for future monitoring \nperiods include freshwater fish surveys to document species within aquatic habitats. Regular \npatrols will also document signs of anthropogenic disturbance, such as logging camps, timber piles, \nand used shotgun cartridges. The Community Engagement team plays a critical role in addressing \nand monitoring ongoing hunting activities to mitigate pressures on wildlife populations. \n \nBiodiversity monitoring spans the entire project area, with a particular focus on different habitat \ntypes and key species. A suite of tailored field survey methods is applied to different taxa and are \ndetailed in Table 5.5. Community interviews further enrich the monitoring process by assessing \nlocal harvest practices and threats to biodiversity. To evaluate conservation success, rigorous data"}, {"uid": "c068", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "A2", "paragraph_id": "p112-03", "page": 112, "text": "Danum and Maliau) took place almost 20 years before the start of the Project. Other formerly Class II \nForest Reserves (e.g. Ulu Segama and Malua) have primarily been protected because of external financial \nincentives; Therefore the outcome of the common practice analysis is that the project activity, without the \nprospect of the sale of GHG credits, is not common practice."}, {"uid": "c069", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "A2", "paragraph_id": "x1-p32-01", "page": 32, "text": "PROJECT DESIGN DOCUMENT FORM (CDM PDD) - Version 03 \n \nCDM – Executive Board  \n \n \n \n \n \n \n \n \npage 32 \n \n \nOutcome of Step 2: \nIt can be justifiably concluded that the CDM revenues which the project activity would generate through \nsale of the emission reductions is very crucial to sustain the operations of the project activity. The returns \nfrom the project after considering CDM revenues give a project IRR of 11.54%. Thus, with CDM \nbenefits the project becomes financially attractive in as much as the project IRR crosses the benchmark.  \n \nHence the project is additional. \n \n \nStep 3: Barrier Analysis:  \n \nSub-step 3a: Identify barriers that would prevent the implementation of the type of the proposed project \nactivity \n \nThe project proponent has not opted for Barrier Analysis to demonstrate additionality for the project \nactivity.  \n \nStep 4: Common practice analysis \n \nSub-step 4a: Analyze other activities similar to the proposed project activity: \n \nThe re-assessment studies of hydro-electric potential of the country, completed by CEA in 198729, have \nassessed the economically exploitable hydro power potential as 84,04430 MW at 60% load factor. As on \n31.03.2007, the hydro-electric schemes in operation account for only 20.32% and those under execution \nfor 5.18% of the total potential at 60% Load Factor. Thus, the bulk of the potential (74.50%) remains yet \nto be developed. \n \nThe All-India aggregate installed capacity of electric power generating stations under various utilities as \non 31.3.2007 was 132329.21 MW comprising 34653.77 MW of hydro, 86014.84 MW of thermal, 3900 \nMW of nuclear and 7760.60 MW of Renewable Energy Sources (RES). The percentage share of hydro, \nthermal, nuclear and RES of the total installed capacity stood at 26.1931%, 65%, 2.95% and 5.86% \nrespectively. \n \nIndia has for many years faced severe power shortages. Currently, at the time of peak demand, power \nshortages are estimated to be about 12%, while annual energy shortages are nearly 7% of demand32. \nThese shortages are likely to continue and increase in the foreseeable future, even with the planned \nadditions in generation capacity. Analysis shows that the gap in supply (after considering the impact of \nprice elasticity on demand) can be only marginally reduced by loss reduction and efficiency gains. The"}, {"uid": "c070", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "A3", "paragraph_id": "p52-06", "page": 52, "text": "☐  Yes  \n \n \n \n☐  No \nIf no, describe which mandated laws, statutes, or other regulatory frameworks require project \nactivities and provide evidence of systematic non-enforcement to demonstrate regulatory \nsurplus.   \n3.5.2 Additionality Methods \nAs per the section 7 of applied methodology: \n \nStep 1: Regulatory surplus \nThe project is an entirely voluntary activity undertaken by the PP and is not mandated by any \nlaw, statute, or regulatory framework of host country."}, {"uid": "c071", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "A1", "paragraph_id": "x1-p27-02", "page": 27, "text": "PROJECT DESIGN DOCUMENT FORM (CDM PDD) - Version 03 \n \nCDM – Executive Board  \n \n \n \n \n \n \n \n \npage 27 \n \n \n \nThus the ex bus tariff applicable for sale in the open market after commissioning of the project activity at \nthe time of investment decision after deducting the transmission cost and trading margin has been \nestimated to be INR 3.27 per unit. The same has been used in the IRR calculations.  Considering the \nelectricity forecast made by CEA in its 17th Electric Power Survey Report28 that by 2011-12, the \nelectricity requirements will be met in full, it is reasonable to assume that the merchant power will have a \nstabilised rate thereafter. \n  \nAt the time of conceptualization of the project, the concept of open market sale in the country was in a \nnascent stage. The project proponent also did not have any experience in operation of merchant power \nplants. With no assured buyer, there is no guarantee for off taking of the output. Also, with the project \nactivity being a hydel power project, 73% of the generation would happen between the months of May to \nSeptember. If there is no spot demand for such power during these months, such power would need to be \nsupplied to the grid for no additional revenues.  \n \nThus although the provision for sale in open market was not contemplated at the time of investment \ndecision, the same has been incorporated to be conservative while demonstrating project returns. \n \nThe IRR of the project activity without considering CDM benefits has been estimated to be 9.80 % which \nis lower in comparison to benchmark WACC of 11.45%. \n \nSub-step 2d. Sensitivity analysis \n \nIn accordance with the guidance on the assessment of investment analysis, only variables, \nincluding the initial investment cost, that constitute more than 20% of either total project costs or \ntotal project revenues should be subjected to reasonable variation. The results of the sensitivity \nanalysis are given hereunder: \n \n \n \n \n \n \nTable: Results of Sensitivity Analysis \n \nParameters \n10% \nBase \nCase"}, {"uid": "c072", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "A2", "paragraph_id": "p33-02", "page": 33, "text": "Therefore, the impact of the stoves will be \nassessed at the sub-national level in accordance \nwith each PI
