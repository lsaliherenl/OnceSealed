 description, and not at the national \nlevel as the commenter suggests. \n \nAdditionally, the National GHG Inventory, \nreferenced in the public commentary, references \nstudies that were published in 2013 and earlier. \nThe socio-economic situation, the affordability of \nelectricity and population density in rural areas in \nSouth Africa has changed considerably in the last \neight years and has since also been exacerbated \nby the global Covid-19 pandemic151617.  \n \nAccording to the Global Forest Watch platform, \nSouth Africa lost 1.48 Mha of tree cover from 2001 \nto 2020, equivalent to a 25% decrease in tree \ncover since 2000. The Global Forest Watch also \nreported that in 2020 alone, South Africa lost \n30.3kha of natural forest.18 \n \nAlthough South Africa’s forestry sector is well \ndeveloped, the heavy dependency of the rural \npoor in South Africa on forest resources is \nexerting pressure on indigenous forests and \nwoodlands2. The unsustainable harvesting of \nfuelwood has resulted in forest degradation, loss \nof millions of hectares of forest (deforestation) and \ndesertification. The annual deforestation rate in \nSouth Africa is estimated to be 0.2 percent.” 19"}, {"uid": "c073", "project_id": "VCS1742", "project_name": "Hydroelectric Project in Kinnaur District in Himachal Pradesh", "question_id": "Q1", "paragraph_id": "x1-p49-04", "page": 49, "text": "Annual Generation EGy is calculated as follows: \nParameters \n \n \n \n \n \nEnergy generation in 2011-12 (16/08/2011 to 31/03/2012) \n1343.64 \nGWh \nElectricity Generation from 2012-13 onwards (01/04/2012 to 31/03/2013) \n4463.88 \nGWh \nAuxiliary consumption \n0.7 \n% \nTransformation Losses \n0.5 \n% \nNet generation in 2011-12 (16/08/2011 to 31/03/2012) \n1327.51 \nGWh \nNet Generation from 2012-13 onwards (01/04/2012 to 31/03/2013) \n4410.31 \nGWh \n  \nBaseline Emission factor (Northern Grid) \n803.1 \ntCO2/GWh \nThe Baseline Emission Factor for the Northern Grid has been calculated using data from : \nThe CO2 Baseline Database for the Indian Power Sector, Central Electricity Authority (CEA), Version 4.0.\n \nBaseline Emissions \nBEy = EFy x EGy \nBaseline emissions in 2011-12 (16/08/2011 to 31/03/2012) \n1066123 \ntCO2"}, {"uid": "c074", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "S2", "paragraph_id": "p2-24", "page": 2, "text": "2.3 \nEnvironmental Impact ..................................................................................................... 24"}, {"uid": "c075", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "Q1", "paragraph_id": "p33-03", "page": 33, "text": "Parameter \nValue \nNomenclature \nSource \nEFgrid,y \n0.9653 tCO2/MWh \nCombined margin CO2 \nemission factor for the \nproject electricity system \nin year y"}, {"uid": "c076", "project_id": "VCS1851", "project_name": "Renewable Solar Power Project by ReNew Solar Power Private Limited", "question_id": "Q4", "paragraph_id": "p57-05", "page": 57, "text": "The meters is approved, tested & sealed by the State Utility. The \nmeters are in the custody of State Utility. The frequency of \ncalibration is once in 5 years. 68 The monthly electricity \nsupplied/exported by the project activity in the JMR report is \ncross checked with the monthly invoices of sale. In the absence \nor delay in the meter calibration appropriate Guidelines will be \napplied appropriately to confirm the conservativeness of \nmetering.  \n \nThe metering arrangement, accuracy class of meters, calibration \nfrequency is under control of state electricity board and PP do not \nhave any control on it. PP is getting value of net electricity \nsupplied to grid and the same is considered the monitoring \nparameter.  \n \nThe billing is raised based on substation meters. \nPurpose of data \nCalculation of baseline emissions"}, {"uid": "c077", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "S3", "paragraph_id": "p2-25", "page": 2, "text": "2.4 \nPublic Comments ............................................................................................................. 25"}, {"uid": "c078", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "A3", "paragraph_id": "p60-02", "page": 60, "text": "1.11.2 Regulatory Additionality \nCIMA’s agreement to support the management of the park was a completely voluntary action; there was \nno regulatory obligation. Because of resource limitations, it is almost certain that the Peruvian \ngovernment would not have designated PNCAZ as a national park if an organization had not been willing \nto fund and manage the park. Additional background regarding the creation of the park is provided in \nSection 2.5, Additionality. \n \nIn the absence of this REDD project, the intense deforestation surrounding PNCAZ would overwhelm any \nweight that a national park designation carries when it is only a “paper park” and the intact forests of the \npark would succumb to fragmentation and deterioration. When the park was established, there were \nlarge-scale illegal logging settlements operating in the park. These operations were all removed from the \npark peacefully, in coordination and collaboration with surrounding communities.  \n \nIn addition, the regional governments’ resources are severely strained, especially given the rapid, large \ninflux of immigrants.  There is currently insufficient capacity to ensure awareness of and adherence to \nnational, regional and local laws in the buffer zone.  Without the project, land-use zoning and tenure \nprocesses would be limited to nonexistent and illegal activities would seldom be reported to the correct \nlaw enforcement authorities by community members \n \n \n1.12 Ownership and Other Programs"}, {"uid": "c079", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "Q1", "paragraph_id": "p62-02", "page": 62, "text": "For this ARR project activity, Face in 1999 commissioned Meijer to carry out a \nbaseline study whose results show that changes in the carbon stocks for both \nabove and below ground biomass are expected not to exceed actual net GHG \nremovals by sinks and are therefore assumed to be zero in the absence of the \nproject activity. Hence the formula above is only applied to multiply the 5.2 tonnes \nof carbon per hectare (adjusted from Meijer, 1999), which is the conservative \nvalue of the carbon stock in the stratum ‘banana plantation’, with the combined \narea Ai of stratum ‘Planted Area’ and ‘Regenerating Area’. The total area to be \nplanted during the crediting period is presented in Table 7.2 and has a size of \n6,000 hectares. In addition, the Regenerating Area is 2,593 hectares. The \ncombined area is therefore 8,593 hectares. As the baseline is in a steady state, \nthere is no increases in GHG removals. See Annex III for details on the estimation, \nand the spreadsheet ´ Kibale Baseline Recalculation_082711 ´, which details the \ncalculation of the mean tree carbon stock in the baseline, based on inventory data \nby Meijer in 1999. In addition, the carbon stock changes in dead wood, litter and \nsoil organic matter are conservatively assumed to be zero based on the \nmethodology applied."}, {"uid": "c080", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "S4", "paragraph_id": "p28-11", "page": 28, "text": "1) The project proponent \nshall \nrecognize, \nrespect and support \nlocal \nstakeholders’ \nproperty \nrights \nand \nwhere feasible, take \nmeasures \nto \nhelp \nsecure \nrights. \nThe \nproject \nshall \nnot \nencroach on private, \nstakeholder \nor \ngovernment property \nor relocate people off \ntheir \nlands \nwithout \nconsent. The project \nmay affect property \nrights if free, prior and \ninformed consent is \nobtained from those \nconcerned \nand \na"}, {"uid": "c081", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "P2", "paragraph_id": "p30-01", "page": 30, "text": "Map 1.2: Topographic Map of PNCAZ and Buffer Zone (together forming the project zone) in 2008. The \narea encompasses an elevation range of approximately 2000 meters."}, {"uid": "c082", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "A3", "paragraph_id": "p36-10", "page": 36, "text": "Applicable \nA single aerobic treatment technique is not suitable for \ntreating low concentration organic wastewater in \nwastewater. This kind of wastewater contains a large \namount of highly concentrated organic wastewater, which \nis difficult to be treated by the aerobic method and does \nnot meet the Chinese environmental quality standards \nand pollutant discharge standards for discharge to water \nbodies. \nAt present a combine Anaerobic Digester-Aerobic \nTreatment system is considered to be one of the most \nadvanced \nmanure \nmanagement \nsystems, \nbut \nto \nimplement such technology need high invest and the \nproposed project will not be invested and constructed \nwithout being registered as a VCS project. \n \n \nOutcome of Step 1a: In summary, the alternatives to the baseline scenario are identified by the \ntool 02:” Combined tool to identify the baseline scenario and demonstrate additionality (Version \n07.0)”as: \nScenario 6: “The manure is disposed in an uncovered anaerobic lagoon”  \nScenario 8&17: Anaerobic Digester-Aerobic Treatment i.e., the project activity not being \nregistered as a VCS project activity. \n \nStep 1b: Consistency with mandatory applicable laws and regulations \nThere is no legal law and regulation to mandate the livestock farm owners to implement \nanaerobic digestion, aerobic or other biological treatment techniques to treat the animal manure \nin China. Only the manure is prohibited to discharge directly into environment without any \ntreatment as per Regulations on Prevention and Control of Pollution from Livestock and Poultry \nFarming11 issued by the State Council in Nov. 2013."}, {"uid": "c083", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "Q3", "paragraph_id": "p62-02", "page": 62, "text": "For this ARR project activity, Face in 1999 commissioned Meijer to carry out a \nbaseline study whose results show that changes in the carbon stocks for both \nabove and below ground biomass are expected not to exceed actual net GHG \nremovals by sinks and are therefore assumed to be zero in the absence of the \nproject activity. Hence the formula above is only applied to multiply the 5.2 tonnes \nof carbon per hectare (adjusted from Meijer, 1999), which is the conservative \nvalue of the carbon stock in the stratum ‘banana plantation’, with the combined \narea Ai of stratum ‘Planted Area’ and ‘Regenerating Area’. The total area to be \nplanted during the crediting period is presented in Table 7.2 and has a size of \n6,000 hectares. In addition, the Regenerating Area is 2,593 hectares. The \ncombined area is therefore 8,593 hectares. As the baseline is in a steady state, \nthere is no increases in GHG removals. See Annex III for details on the estimation, \nand the spreadsheet ´ Kibale Baseline Recalculation_082711 ´, which details the \ncalculation of the mean tree carbon stock in the baseline, based on inventory data \nby Meijer in 1999. In addition, the carbon stock changes in dead wood, litter and \nsoil organic matter are conservatively assumed to be zero based on the \nmethodology applied."}, {"uid": "c084", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "A2", "paragraph_id": "p3-02", "page": 3, "text": "1 PROJECT DETAILS \n1.1 \nSummary Description of the Project \n \nSummary description of the technologies/measures to be implemented by the project: \n \n‘DelAgua clean cooking grouped project in Rwanda’ is a voluntary Grouped Project (GP) \naimed at distributing fuel efficient improved cookstoves (ICS) to households in Rwanda. The \nProject Participant (PP) of the GP for all the communication, management, and ownership \nrights of the Greenhouse Gas (GHG) Emission Reduction Units (ERU) is DelAgua Health \nRwanda (Voluntary) Limited (DelAgua) and the ICS under this GP will be distributed by \nDelAgua. The distribution of ICS is not mandated by Rwandan law and the Grouped Project \nis a voluntary initiative being run by the PP DelAgua. The program is not being implemented \nas a result of any government legislation or intervention. Throughout this Project Description, \nthis grouped project may be interchangeably referred as “program\". The PP plan to distribute \n400,000 improved cookstove under the grouped project during first renewable crediting \nperiod. It is intended that under this GP two types of single pot portable stoves will be \ndistributed, which are SSM S32 X stove and Burn Kuniokoa G21. Each household will receive \n1 ICS. \n \nThe location of the project: \n \nUnder the GP, DelAgua will distribute the project technologies to individual households and \ncommunities within the host country Rwanda. The PAIs will occur in geographically defined \nregions within Rwanda. The details of the GP and PAI locations are provided in Section 1.13 \nof this document. All households will be in rural areas of the identified regions in section 1.13 \nof this document. \n \nImplementation Dates: \nFull details of implementation dates and numbers for each PAI under the GP are laid out in \nsection 1.12 of this document. \n \n An explanation of how the project is expected to generate GHG emission reductions or \nremovals: \n \nThe GP will follow the VCS Methodology from Sectoral Scope 3 - VM0050 “Energy Efficiency \nAnd Fuel-Switch Measures In Cookstoves”, version 1.0 for ER calculations. The \nimplementation (distribution of ICS units) and parameters set for ER calculations within the \nGP will be monitored on a periodic basis, based on the requirements provided within the \napplied methodology. \n \nThe cookstove project in Rwanda will reduce GHG emissions by replacing inefficient \ntraditional wood-fuel cookstoves with high-efficiency ICS units. By improving combustion \nefficiency and reducing firewood consumption, the project will reduce equivalent GHG \nemissions from incomplete combustion and help prevent deforestation. Additionally, the \nproject will improve indoor air quality, reduce fuel costs, and enhance community well-being, \ncontributing to both climate change mitigation and sustainable development. \n \nA brief description of the scenario existing prior to the implementation of the project:"}, {"uid": "c085", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "Q1", "paragraph_id": "p123-12", "page": 123, "text": "Ex-ante baseline emissions occurring in the leakage belt are estimated by first estimating the amount \nof deforestation that is thought to be displaced from the project area to the leakage belt due to the \nimplementation of the REDD project activity. For ex ante purposes, a leakage factor of 20% is applied, \ni.e. 20% of deforestation caused by local agents is shifted outside of the project area due the project \nactivity. Leakage is then calculated as the difference between project and baseline emissions in the \nleakage belt, as outlined in Equation 1 from LK-ASU Module (below). Ex-ante estimates of the net \nCO2 emissions due to unplanned deforestation displaced from the project area to the leakage belt is \ncalculated for each year in the baseline period in Table 3.38."}, {"uid": "c086", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D2", "paragraph_id": "p80-03", "page": 80, "text": "Financial Services Authority (OJK) Regulation No. 14/2023 on Carbon Trading in the Carbon \nExchange. The project is registered under the SRN PPI with registration number REG-11-PR-X-\n2025-6737. Although the SRUK registry is not yet available at the time of the preparation of the \nPD, the recently launched registry system of Indonesia ensures transparency and prevents \ndouble counting, meaning that even if voluntary credits are sold to foreigners, the emissions \nreductions remain as Indonesian assets toward their NDC. \n \n \n2. Regional and Local Environmental Regulations \n \nPeatland and Forest Fire Management \nPresidential Instruction (INPRES) No. 10/2011 and subsequent renewals regarding Peatland \nManagement \nGovernment Regulation PP No. 71/2014 on Protection and Management of Peatland Ecosystems \nRegional Regulation of Central Kalimantan Province No. 1/2020 on Forest Fire Control \n \nSustainable Land and Water Management \nMinistry of Environment and Forestry Decree No. P.15/MENLHK/SETJEN/KUM.1/2/2017 on \nWater Table Measurement in Peat Ecosystems \nMinistry of Environment and Forestry Regulation No. 60/MENLHK/Setjen/Kum.1/10/2019 on \nPeat Ecosystem Management \n \n3. Compliance Assurance Measures \nThe Katingan Mentaya Project adheres to these regulations through the following mechanisms:"}, {"uid": "c087", "project_id": "VCS1728", "project_name": "Bundled Wind Power Project by Mytrah Group", "question_id": "A3", "paragraph_id": "p36-04", "page": 36, "text": " \nPower generation using wind energy is not a legal requirement or a mandatory option.  \n \nThere are state and sectoral policies, framed primarily to encourage wind power projects. \nThese policies have also been drafted realizing the extent of risks involved in the projects \nand to attract private investments. \n \nThe Indian Electricity Act, 2003 (May 2007 Amendment) does not influence the choice of \nfuel used for power generation. \n \nThere is no legal requirement on the choice of a particular technology for power \ngeneration. \n \nOutcome of Sub-step 1b: Hence, both the alternatives enlisted above are found to comply with \nthe mandatory laws and regulations taking into account the enforcement of the legislations in the \nregion or country and EB decisions on national and/or sectoral policies and regulations. However, \nAlternative 2 has been selected as the appropriate baseline alternative for this project activity. \n \nStep 2: Investment analysis \n \nDetermine whether the proposed project activity is economically or financially less \nattractive than at least one other alternative, identified in step 1, without the revenue from \nthe sale of emission reductions credits. To conduct the investment analysis, use the \nfollowing sub-steps: \n \nSub-step 2a: Determine appropriate analysis method \nThe Project activity envisages to export the power to Indian grid and the revenues from the sale \nwould be generated in accordance with the terms and tariffs established in the Power Purchase \nAgreement (PPA). Thus, simple cost analysis (Option I)  cannot be used as the analysis method \nas the sale of the units of generated electricity shall result in a revenue stream during the \noperations of the Project activity. \n \nIn the absence of the project activity grid electricity would have been the obvious choice for the \nProject which requires no investment. Hence investment comparison analysis (Option II) is also \nnot appropriate for the project activity.  \n \n \nAfter eliminating Option I and Option II, the use of Benchmark analysis (Option III) is the method \nof analysis that has been selected as the most suitable method. This method determines the \nattractiveness of the project activity for the investors, as well as provides a measure of the \nviability of the investment to generate revenues during its operation, as compared with other"}, {"uid": "c088", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "S2", "paragraph_id": "p343-06", "page": 343, "text": "Objective 5: Capacity building and engagement with the biodiversity team, project partners \nand key stakeholders for biodiversity conservation. \n \nOutput 5.1. Capacity building of the internal Katingan Mentaya Project biodiversity team, \nproject partners and key stakeholders through training and workshops (e.g., on scientific \nmonitoring methods, species identification, biodiversity conservation). \nOutput 5.2. Development and dissemination of educational materials (e.g., posters, \nleaflets, reports) related to biodiversity conservation to promote public awareness and \nengagement of key stakeholders.  \nOutput 5.3. Establishment of communication channels (e.g., social media platforms, \nWhatsApp groups, online newsletters) and collaborative platforms (e.g., forums, \ndiscussion/working groups) to facilitate ongoing engagement and knowledge exchange. \n \nOutcome 5.1. Increased knowledge and skills among biodiversity team members, project \npartners and stakeholders regarding biodiversity conservation principles and practices. \nOutcome 5.2. Enhanced collaboration and networking among project partners and \nstakeholders, leading to improved coordination and synergy of conservation efforts. \nOutcome 5.3. Strengthened engagement and participation of local communities in \nbiodiversity conservation initiatives."}, {"uid": "c089", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "Q4", "paragraph_id": "p19-02", "page": 19, "text": "Per ACM0001, no leakage effects need to be accounted."}, {"uid": "c090", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "S4", "paragraph_id": "p32-19", "page": 32, "text": "The distribution and use of Improved Cookstoves (ICSs) do not infringe upon \nthe rights of Indigenous Peoples (IPs), Local Communities (LCs), or \ncustomary rights holders, as outlined in international human rights law, the \nUnited Nations Declaration on the Rights of Indigenous Peoples (UNDRIP), \nand ILO Convention 169 on Indigenous and Tribal Peoples. ICSs are fully \nportable, require no land acquisition or infrastructure modifications, and do \nnot interfere with traditional resource use or customary land tenure systems. \nFurthermore, the implementation of the project is voluntary, ensuring that \ncommunities retain full autonomy in decision-making regarding stove \nadoption. The project aligns with the principles of Free, Prior, and Informed \nConsent (FPIC), respecting the self-determination and cultural practices of \nIPs and LCs while contributing to improved health and environmental \nbenefits."}, {"uid": "c091", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "Q2", "paragraph_id": "p132-04", "page": 132, "text": "The 𝐿𝐸𝐵𝐿,𝑁2𝑂,𝑦, 𝐿𝐸𝑃𝐽,𝑁2𝑂,𝑦, , 𝐿𝐸𝐵𝐿,𝐶𝐻4,𝑦 𝑎𝑛𝑑 𝐿𝐸𝑃𝐽,𝐶𝐻4,𝑦,,can be calculated by Equation 34-43"}, {"uid": "c092", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "S4", "paragraph_id": "p300-02", "page": 300, "text": "The project recognises and formalises community members' management rights over the land \nwithin the project area, aligning with international REDD+ safeguards and principles of equitable \nbenefit-sharing (UNFCCC, 2011). Their direct involvement and the practices they implement are \nintegral to achieving the Katingan Mentaya Project’s goals. These efforts make community \nmembers rightful claimants to the project’s climate, community, and biodiversity benefits. This \nsetup underscores their crucial role in sustaining the project’s long-term environmental and \nsocio-economic outcomes, affirming their management rights and contributions to the project’s \nsuccess (HCV Resource Network, n.d.)."}, {"uid": "c093", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "Q3", "paragraph_id": "p16-02", "page": 16, "text": "flow (at 68°F and one atmosphere of pressure), methane concentration, the gross heat content (higher \nheating value) of methane, and the actual temperature and pressure. CNBE determines the volume of \nmethane destroyed by converting the MMBtu values to total methane gas flow in standard cubic feet.  \nThe total methane flow in standard cubic feet is then translated into metric tons of methane using the \nUniversal Gas constant, the molecular weight of methane and a standard unit conversion factor.  This \nresult provides FCH4,EL,y . \n \nThe flare is available to destroy landfill gas if the energy system is not operating.  However, it has not \nbeen used in several years.  The flaring equations are included for completeness in case it is needed.  \nThe following equation determines the amount of methane, which is destroyed in flaring. \n \nFCH4,flared,y =FCH4,sent_flare,y -  PEflare,y /GWPCH4 \n \nWhere: \nFCH4,flared,y = Amount of methane in the LFG which is destroyed by flaring in year y (tCH4/yr) \nFCH4,sent_flare,y = Amount of methane in the LFG which is sent to the flare in year y (tCH4/yr) \nPEflare,y = Project emissions from flaring of the residual gas stream in year y (tCO2e/yr) determined \nfollowing the procedure described in the tool “Project emissions from flaring” \nGWPCH4 = Global warming potential of CH4 (tCO2e / tCH4) \n \nFCH4,sent_flare,y is determined in the same manner as FCH4,EL,y described above.   \n \nBaseline Emissions Reductions (FCH,BL,y) \n \nPer ACM0001, this Project falls under the requirements of Case 3 for the baseline system: No \nrequirement to destroy the methane and an existing LFG capture and destruction system. \n \nBecause “the amount of methane captured with the existing system can be monitored separately from the \namount captured under the Project, and the efficiency of the existing system is not impacted on by the \nProject system during the crediting period”, the amount of methane that would be flared in the baseline is \nequivalent to that collected and destroyed from the District Initial System.   \n \nFCH4,BL,y = FCH4,BL,sys,y   (Eq. 11) \n   \nFCH4,BL,sys,y  = FCH4,destroyed,y  (modified Eq.12) \n \nWhere: \nFCH4,BL,sys,y  = Amount of methane in LFG that would be flared in the baseline for year y for the case of an \nexisting LFG capture system ( t CH4/yr) \nFCH4,destroyed,y  = Amount of methane in the LFG which is destroyed in year y (t CH4/yr) \n \nThe subscript in the second half of Equation 12 has been modified to reflect the fact that the LFG is not \nflared in the Project.  Because electricity generation has a higher destruction efficiency than a flare, this is \na conservative modification that reflects actual Project operations. \n \nAs described in the deviation section, there is no flow meter installed on the collection pipe from the \nDistrict Initial System.  Given the collection system design and meter requirements, installing a meter at \nthis location would not produce reliable, meaningful results. Instead, well-head flow measurements are \ncollected manually two times each month.  These results are used to calculate the relative contribution of \nthe District Initial System to the overall flow of LFG destroyed by the engines.  This portion of the total \nflow represents FCH4,BL,y and will be calculated on a monthly basis and subtracted to account for the \namount of methane destroyed in the baseline scenario. \n \nEx Ante Estimate of Emission Reductions"}, {"uid": "c094", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "D3", "paragraph_id": "p46-02", "page": 46, "text": "Sub-step 4a.3: within the projects identified in Step 2, identify those that are neither registered \nCDM project activities, project activities submitted for registration, nor project activities \nundergoing validation. Note their number Nall."}, {"uid": "c095", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D2", "paragraph_id": "p97-15", "page": 97, "text": "2.6.2 Double Claiming, Other Forms of Credit, and Scope 3 Emissions (VCS, 3.24)"}, {"uid": "c096", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "S4", "paragraph_id": "p300-03", "page": 300, "text": "4.5.2 \nShort-term and Long-term Community Benefits (CCB, GL2.2) \nThe Katingan Mentaya Project (KMP) provides the 34 surrounding villages with substantial and \nlasting improvements in community well-being. Through close collaboration with local \nstakeholders, the project establishes sustainable land management practices—including \nagroecology, social forestry, biodiversity surveys, and forest conservation—that collectively restore \necosystems and transition communities away from extractive forest uses. Its integrated approach \nensures that benefits are both immediate and enduring, while strengthening local rights, equity, \nand resilience. \n \n• \nShort-term Well-being Benefits \nIn the short term, the project delivers tangible improvements in livelihoods, health, education, \nand participation. \n• \nAlternative Livelihoods and Income Opportunities: Communities engage in sustainable \nagroforestry, aquaculture, eco-tourism, microfinance schemes, small-scale livestock, and the \ncollection and marketing of Non-Timber Forest Products (NTFPs). These activities diversify income \nsources, reduce deforestation pressures, and align local economies with broader environmental \ngoals. \n• \nTraining and Capacity Building: Through targeted programmes in forest management, \nentrepreneurship, climate adaptation, and sustainable farming, community members strengthen \ntechnical skills and improve long-term employability. \n• \nImproved Services and Infrastructure: Investments in clean water, sanitation, and local health \nfacilities have reduced health risks and enhanced quality of life. \n• \nStrengthened Social Capital: Participatory planning and Free, Prior and Informed Consent (FPIC) \nprocesses empower communities to participate actively in governance and forest management, \nreinforcing trust, inclusion, and shared ownership of project outcomes. \n \n• \nLong-term Well-being Benefits \nOver its 60-year lifespan, KMP promotes structural transformation that builds independence, \nresilience, and social equity. \n• \nEconomic Resilience and Diversification: Long-term financial security is fostered through \nmicrofinance, community cooperatives, and SME development, helping families withstand market \nfluctuations and climate shocks. \n• \nTenure Security and Legal Empowerment: The project supports the formal recognition of \ntraditional land through participatory land-use mapping and the facilitation of social forestry \npermits, in alignment with Indonesia’s Social Forestry Programme. These actions secure \nmanagement rights, enhance livelihoods, and protect communities from external commercial \npressures. \n• \nCultural and Environmental Safeguarding: Restoration of peatlands and forests protects \necosystem services and culturally significant sites, maintaining both environmental integrity and \ncommunity identity. \n• \nClimate and Risk Resilience: Rewetting, fire prevention, and hydrological restoration activities \nsafeguard agriculture and livelihoods, reducing vulnerability to environmental shocks."}, {"uid": "c097", "project_id": "VCS1851", "project_name": "Renewable Solar Power Project by ReNew Solar Power Private Limited", "question_id": "Q3", "paragraph_id": "p30-05", "page": 30, "text": "Alternative 2: No proposed project activity and equivalent amount of energy would have \nbeen produced by the grid electricity system through its currently running power plants \nand by new capacity addition to the grid i.e. Continuation of the present situation. \n \nThe PP would have continued without investment in Project activity with usual business activities. \nThe grid would continue with the fossil fuel based power projects and this would result in GHG \nemissions. Hence, the new capacity add-on from a fossil fuel based power plant is appropriate, \nrealistic & credible baseline alternative for the project activity. \n \nOutcome of Sub-step 1a: All the realistic alternatives for the project activity have been enlisted \nabove.  \n \nThus though two alternatives are mentioned above as per step of additionality tool, the first \nalternative is not possible as project activity is not viable without carbon credit benefits and \nsecond alternative is the baseline scenario for the project activity as per methodology as \nmentioned in section 2.4 of joint VCS PD & MR. \n \nIt is to be noted that being the green field project activity, “the baseline scenario is electricity \ndelivered to the grid by the project activity would have otherwise been generated by the operation \nof grid-connected power plants and by the addition of new generation sources, as reflected in the \ncombined margin (CM) calculations described in the “Tool to calculate the emission factor for an \nelectricity system”. \n \nSub-step 1b: Consistency with mandatory laws and regulations:"}, {"uid": "c098", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "D3", "paragraph_id": "p80-03", "page": 80, "text": "Financial Services Authority (OJK) Regulation No. 14/2023 on Carbon Trading in the Carbon \nExchange. The project is registered under the SRN PPI with registration number REG-11-PR-X-\n2025-6737. Although the SRUK registry is not yet available at the time of the preparation of the \nPD, the recently launched registry system of Indonesia ensures transparency and prevents \ndouble counting, meaning that even if voluntary credits are sold to foreigners, the emissions \nreductions remain as Indonesian assets toward their NDC. \n \n \n2. Regional and Local Environmental Regulations \n \nPeatland and Forest Fire Management \nPresidential Instruction (INPRES) No. 10/2011 and subsequent renewals regarding Peatland \nManagement \nGovernment Regulation PP No. 71/2014 on Protection and Management of Peatland Ecosystems \nRegional Regulation of Central Kalimantan Province No. 1/2020 on Forest Fire Control \n \nSustainable Land and Water Management \nMinistry of Environment and Forestry Decree No. P.15/MENLHK/SETJEN/KUM.1/2/2017 on \nWater Table Measurement in Peat Ecosystems \nMinistry of Environment and Forestry Regulation No. 60/MENLHK/Setjen/Kum.1/10/2019 on \nPeat Ecosystem Management \n \n3. Compliance Assurance Measures \nThe Katingan Mentaya Project adheres to these regulations through the following mechanisms:"}, {"uid": "c099", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "Q1", "paragraph_id": "p139-10", "page": 139, "text": "∆𝑪𝑵𝑬𝑻|𝑩𝑺𝑳,𝒕∗= ∑\n[ ∆𝑪𝑵𝒆𝒕,𝒑|𝑩𝑺𝑳(𝟏)\n𝑷\n𝒑=𝟏\n+ ∆𝑪𝑵𝒆𝒕,𝒑|𝑩𝑺𝑳(𝟐−𝟏𝟎) + ∆𝑪𝑵𝒆𝒕,𝒑|𝑩𝑺𝑳(𝟏𝟏−𝟐𝟎) + ∆𝑪𝑵𝒆𝒕,𝒑|𝑩𝑺𝑳(+𝟏)]"}, {"uid": "c100", "project_id": "VCS138", "project_name": "Greater New Bedford LFG Utilization Project", "question_id": "Q3", "paragraph_id": "p14-03", "page": 14, "text": "1. A separate LFG meter is not present on each of the four combustion engines.  A single meter is \nused immediately before the piping splits to each engine.  This meter is continuously recording \ndata.  Operating data is tracked for each engine so it is possible to calculate the flow destroyed \nby each engine and to ensure that LFG is destroyed.  Flow controls are in place to ensure no \nLFG is sent to an engine that is not operating. This does not affect the conservativeness of the \nemissions reductions claimed. \n2. Ex-ante emissions reductions calculations use historic Project specific data as the basis for \nprojecting future emissions rather than the required CDM estimation tools.  Using real data allows \nthe estimations to be more accurate and reflect actual Project operating conditions.  his does not \naffect the conservativeness of the emissions reductions claimed but increases the accuracy of the \nex-ante projections ensuring the project is forecasting obtainable, appropriate emissions \nreductions.   \n3. There is no flow meter installed on the collection pipe from the District Initial System to separately \nmonitor the contribution of the original baseline system.  Given the collection system design and \nmeter requirements, installing a meter at this location would not produce reliable, meaningful \nresults. Instead, well-head flow measurements are collected manually two times each month.  \nThese results are used to calculate the relative contribution of the District Initial System to the \noverall flow of LFG destroyed by the engines.  This portion of the total flow represents FCH4,BL,y \nand will be calculated on a monthly basis and subtracted from the total flow to account for the \namount of methane destroyed in the baseline scenario.  This approach represents an accurate \nmeasurement of the flow because (a) the portion of the landfill that includes the District Initial \nSystem (Phase 1) is capped so no landfill gas can be passively emitted to the atmosphere, and \n(b) the remaining active wells from the District Initial System are located in such a way as to \nenable capture of all LFG generated within the sphere of influence of the District Initial System.  \nThis deviation decreases the conservativeness of the emissions reductions claimed but \nsignificantly increases the accuracy of the calculations as is allowable under VCS Standard v3.5, \nSection 3.5.1.   \n4. The Project uses the eGrid electricity emissions factor rather than the default emissions factor \nprovided in the CDM tool as explained in the project emissions section.  This deviation decreases \nthe conservativeness of the emissions reductions claimed but significantly increases the accuracy \nof the calculations as is allowable under VCS Standard v3.5, Section 3.5.1. \n \nThese deviations only apply to the monitoring and measurement portions of the Project."}, {"uid": "c101", "project_id": "VCS1477", "project_name": "Katingan Peatland Restoration and Conservation Project", "question_id": "A2", "paragraph_id": "p121-06", "page": 121, "text": "Additionally, the global demand for pulp and paper products has increased (Statista, 2024) and \nacacia plantations are expanding in Indonesia (see above). Also, the analysis performed in the \nproxy areas (see section 3.2.2.2) shows that none of the concessions has been abandoned or \nhave stopped converting the forest into plantations."}, {"uid": "c102", "project_id": "VCS985", "project_name": "Cordillera Azul National Park REDD Project", "question_id": "P1", "paragraph_id": "p26-01", "page": 26, "text": "Project zone (CCB) – combination of the project area and the buffer zone (Figure 1.2).  Because no \nhuman communities exist within the project area, communities within the buffer zone represent all \ncommunities within the project zone.   \n \nOffsite (CCB) – area beyond the project zone. \n \nThe reference region for deforestation, the reference region for location, and the leakage belt are \npresented in Section 3.1.1 along with maps and justifications for the choices made."}, {"uid": "c103", "project_id": "VCS2505", "project_name": "Fuel Efficient Cooking in South Africa", "question_id": "Q1", "paragraph_id": "p50-31", "page": 50, "text": "Bold \ntonnes/year \n5.49 \nQuantity of biomass \nconsumed in baseline"}, {"uid": "c104", "project_id": "VCS2609", "project_name": "Kuamut Rainforest Conservation Project", "question_id": "Q3", "paragraph_id": "p161-12", "page": 161, "text": "The resulting uncertainty if 0.262% is smaller than the 15% threshold indicated in the methodology, \ntherefore no deduction for uncertainty is required."}, {"uid": "c105", "project_id": "VCS4150", "project_name": "DelAgua Clean Cooking Grouped Project in Rwanda", "question_id": "Q1", "paragraph_id": "p68-03", "page": 68, "text": "i. \nSurveys are conducted by staff trained by DelAgua. \nii. \nSupervisors are separately trained by DelAgua to spot-check surveyor results. \niii. \nAll ex-ante and monitored data parameters are collected on smart-phone based \nsurveys and are uniform across all surveyors for any given survey activity. \niv. \nUnknown to the surveyors, the database analysis includes verification of “valid” \nsurveys including by a.) verifying household consent is received and b.) that the \nsurvey duration, as recorded by Internet time, is no shorter or longer than a \nreasonable value. For example, the baseline surveys for Rwanda were validated \nagainst a minimum of 20 minutes and a maximum of 120 minutes. \nv. \nData validation is conducted on the database to ensure that values are numerically \nconsistent, i.e. multiple choice values add up to 100% of respondents. \n \nThe procedures for handling non-conformances with the validated monitoring plan  \nThe project proponent ensure that field personnel have reviewed, understood and have \nagreed to follow the monitoring plan procedures, including provisions for maximizing response \nrates, documenting out-of-population cases, refusals and other sources of non-response. To \nreduce interviewer bias, good questionnaire design and well-tested questionnaires are \ndeveloped. \n \nDelAgua is responsible for training any contractors used during distribution, education and \nmonitoring activities. DelAgua ensures training of all on-site staff with respect to adherence \nto the Monitoring Plan of the project activity. Records of the training will be kept. Internal audit \nof all the records of the distribution, monitoring and education activities are performed on an \nannual basis, and will be carried out once (or twice, based on the requirements and plans) a \nyear. Training records are saved for such training programs, where step-by-step training is \nprovided to the surveyors for a quality data collection process, where they are expected to not \nimpact the materially, degree of conservativeness, and perform the surveys in an unbiased \nmanner. The surveyors are trained on a periodic basis, and refresher trainings are also \nprovided to improve the quality of surveys from time to time. During these audits all the data \nand parameters that need to be monitored as per the monitoring plan will be checked and \nshortcomings if any will be reported and addresses. Since the surveys are electronic in format, \nrecording of responses and the record keeping procedure for these surveys are conveyed to \nthe team through rigorous trainings. \n \nDeviations or errors in data collection are logged and reviewed, with supervisors conducting \nspot checks to ensure compliance. Corrective actions, such as re-training or additional \nsurveys, are taken if non-conformances are found. \n \nBy integrating rigorous training, continuous oversight, and corrective measures, the project \nensures that all monitoring activities align with the validated Monitoring Plan, maintaining data \naccuracy, credibility, and compliance. \n \nCalculation of emission reductions: \nEmission reductions will be calculated using the results of the most recent survey data. The \nupdated parameters adjust all emission reduction results for the year monitored. \n \nSampling Plan: \nPP follows the sampling approach outlined below, which is in line with the most recent version \n(v9.0) of the CDM Standard for Sampling and Surveys for CDM Project Activities and \nProgrammes of Activities:"}, {"uid": "c106", "project_id": "VCS673", "project_name": "Natural High Forest Rehabilitation Project on degraded land of Kibale National Park", "question_id": "S1", "paragraph_id": "p71-02", "page": 71, "text": "6.1.4 Meeting with the LCS and community of Beseri, Nkongoro Parish, \nKamwenge sub-county, Kamwnge Distrtict on 27th November 2007 \n \nThe chairman of Beseri LCI spoke on behalf of his community members on two \nmatters:"}, {"uid": "c107", "project_id": "VCS2846", "project_name": "FSW AMMS GHG Mitigation Project in Nanyang City", "question_id": "Q3", "paragraph_id": "p29-14", "page": 29, "text": "The underlying methodology should specify: \n(a) The gaseous stream the tool should be applied to; \n(b) For which greenhouse gases the mass flow should be \ndetermined; \n(c) In which time intervals the flow of the gaseous stream \nshould be measured; and \n(d) Situations where the simplification offered for \ncalculating the molecular mass of the gaseous stream \n(equations (3) or (17) is not valid (such as the gaseous \nstream is predominantly composed of a gas other than \nN2)."}], "questions": {"A1": {"text": "Does the text report a quantified financial analysis: at least one numeric financial indicator (such as IRR or NPV) together with a benchmark or threshold value it is compared against?", "tr": "Metinde sayısal bir finansal analiz var mı: en az bir finansal gösterge değeri (IRR, NPV gibi) VE karşılaştırıldığı bir eşik/benchmark değeri?", "yes_if": "İki sayı da metinde: ör. 'equity IRR 9.1% ... benchmark 14.5%'.", "no_if": "Sadece 'IRR benchmark'ın altında' deniyor ama sayılar yok; ya da sadece biri var."}, "A2": {"text": "Does the text discuss common practice, i.e. whether similar activities are already widespread in the region or sector?", "tr": "Metinde 'common practice' analizi var mı: benzer projelerin bölgede/sektörde ne kadar yaygın olduğu?", "yes_if": "Benzer projelerin sayısı/payı veya 'yaygın değil' sonucuna varan bir analiz anlatılıyor.", "no_if": "Konu hiç geçmiyor ya da sadece bölüm başlığı var."}, "A3": {"text": "Does the text state that the project activity is not required by any law or regulation (regulatory surplus)?", "tr": "Metinde projenin yasal bir zorunluluk olmadığı (regulatory surplus) belirtiliyor mu?", "yes_if": "'No law requires...', 'not mandated by regulation' gibi açık bir ifade.", "no_if": "Sadece yasalara uyulduğu söyleniyor (bu farklı bir şey)."}, "A4": {"text": "Does the text state that carbon credit revenue was considered before or at the start of the project (prior consideration), for example with a date or a document?", "tr": "Metinde karbon gelirinin proje kararından önce/başında düşünüldüğü (prior consideration) belirtiliyor mu?", "yes_if": "Bir tarih, yönetim kurulu kararı veya belgeyle karbon gelirinin baştan hesaba katıldığı söyleniyor.", "no_if": "Bu konu geçmiyor."}, "P1": {"text": "Does the text assess the risk that stored carbon is released (reversal or non-permanence risk), for example with a risk tool, a rating or a score?", "tr": "Metinde depolanan karbonun geri salınma (reversal / non-permanence) riski değerlendirilmiş mi?", "yes_if": "Risk aracı, risk puanı/derecesi veya risk faktörlerinin değerlendirmesi var.", "no_if": "Sadece 'kalıcıdır' iddiası var, değerlendirme yok."}, "P2": {"text": "Does the text give a specific buffer contribution (a percentage or a number of credits set aside)?", "tr": "Metinde tampon havuza (buffer) ayrılan pay sayısal olarak veriliyor mu (yüzde veya kredi sayısı)?", "yes_if": "Ör. 'buffer withholding of 12%' ya da ayrılan kredi sayısı.", "no_if": "Buffer'dan söz ediliyor ama sayı yok."}, "P3": {"text": "Does the text describe concrete measures to monitor or prevent reversals (e.g. fire, illegal logging, land conversion)?", "tr": "Metinde geri salınmayı (yangın, kaçak kesim, arazi dönüşümü) izlemek/önlemek için somut önlemler var mı?", "yes_if": "Devriye, yangın izleme, uydu takibi gibi somut faaliyetler anlatılıyor.", "no_if": "Sadece genel niyet beyanı var."}, "Q1": {"text": "Does the text show how baseline emissions are calculated, with an equation, parameter values or a numeric result?", "tr": "Metinde referans (baseline) emisyonlarının nasıl hesaplandığı denklem, parametre değeri veya sayısal sonuçla gösteriliyor mu?", "yes_if": "Bir formül, emisyon faktörü değeri veya hesaplanmış baseline sayısı var.", "no_if": "Sadece 'baseline methodology'ye göre hesaplandı' deniyor."}, "Q2": {"text": "Does the text address leakage (emissions shifted outside the project boundary), either by quantifying it or by justifying why it is zero?", "tr": "Metinde sızıntı (leakage) ele alınmış mı: sayısallaştırılmış ya da neden sıfır olduğu gerekçelendirilmiş?", "yes_if": "Leakage değeri veya 'leakage is not applicable because ...' gibi gerekçe.", "no_if": "Leakage hiç geçmiyor."}, "Q3": {"text": "Does the text address uncertainty or the use of conservative assumptions in the emission reduction estimate?", "tr": "Metinde belirsizlik veya muhafazakâr (conservative) varsayımlar ele alınıyor mu?", "yes_if": "Belirsizlik oranı, indirim faktörü veya bilinçli muhafazakâr seçim anlatılıyor.", "no_if": "Konu geçmiyor."}, "Q4": {"text": "Does the text describe a monitoring plan that names the parameters to be measured and how often or by what method?", "tr": "Metinde ölçülecek parametreleri ve ölçüm sıklığını/yöntemini belirten bir izleme planı var mı?", "yes_if": "Parametre tablosu, ölçüm cihazı, kalibrasyon veya sıklık bilgisi.", "no_if": "Sadece 'izleme yapılacak' deniyor."}, "D1": {"text": "Does the text state whether the project is registered, or issues credits, under another GHG program (e.g. CDM, Gold Standard)?", "tr": "Metinde projenin başka bir karbon programında (CDM, Gold Standard vb.) kayıtlı olup olmadığı belirtiliyor mu?", "yes_if": "'Not registered under any other GHG program' veya 'also registered under CDM' gibi açık ifade.", "no_if": "Konu geçmiyor."}, "D2": {"text": "Does the text address other environmental credits or certificates (e.g. renewable energy certificates, I-RECs) or participation in an emissions trading scheme?", "tr": "Metinde başka çevresel sertifikalar (REC, I-REC vb.) veya emisyon ticaret sistemleri ele alınıyor mu?", "yes_if": "Bu sertifikalar alınmadığı/alındığı ya da ETS'ye katılmadığı açıkça söyleniyor.", "no_if": "Konu geçmiyor."}, "D3": {"text": "Does the text address the host country's national accounting or registry, or a corresponding adjustment?", "tr": "Metinde ev sahibi ülkenin ulusal muhasebesi/kayıt sistemi veya karşılıklı düzeltme (corresponding adjustment) ele alınıyor mu?", "yes_if": "Ulusal kayıt sistemi, NDC muhasebesi veya corresponding adjustment'tan söz ediliyor.", "no_if": "Konu geçmiyor."}, "S1": {"text": "Does the text describe a stakeholder consultation with specifics such as dates, places, participants or comments received?", "tr": "Metinde paydaş görüşmesi tarih, yer, katılımcı veya alınan yorumlar gibi ayrıntılarla anlatılıyor mu?", "yes_if": "En az bir somut ayrıntı (tarih, yer, katılımcı sayısı, gelen yorum).", "no_if": "Sadece 'paydaşlarla görüşüldü' deniyor."}, "S2": {"text": "Does the text describe a grievance or complaint mechanism through which affected people can raise concerns?", "tr": "Metinde etkilenen kişilerin şikâyet iletebileceği bir mekanizma tanımlanıyor mu?", "yes_if": "Şikâyet kanalı (telefon, kutu, e-posta, süreç) anlatılıyor.", "no_if": "Konu geçmiyor."}, "S3": {"text": "Does the text report an environmental impact assessment or an analysis of the project's environmental risks?", "tr": "Metinde çevresel etki değerlendirmesi veya projenin çevresel risklerinin analizi var mı?", "yes_if": "ÇED yapıldığı/gerekmediği gerekçesiyle veya çevresel risk analizi anlatılıyor.", "no_if": "Sadece 'çevreye faydalı' deniyor."}, "S4": {"text": "Does the text address the rights of local communities or indigenous peoples, such as free, prior and informed consent (FPIC) or benefit sharing?", "tr": "Metinde yerel halkın veya yerli halkların hakları (FPIC, fayda paylaşımı vb.) ele alınıyor mu?", "yes_if": "FPIC, fayda paylaşımı, arazi hakları gibi somut bir konu ele alınıyor.", "no_if": "Konu geçmiyor."}}, "rules": ["Yalnızca gösterilen paragrafa bak: kanıt bu paragrafta yoksa \"hayır\" (belgenin başka yerinde olabileceğini düşünme).", "Standardın gereklilik metni (ör. uyum tablosunun sol sütunu) kanıt sayılmaz; projenin kendi beyanı gerekir.", "Alan bilgisiyle çıkarım yapma; metin söylemeli.", "Belirli faaliyetler gelecek zamanla anlatılıyorsa sayılır; yalnızca genel niyet sayılmaz.", "Bir büyüklüğü ölçme yöntemi anlatılıyorsa konu ele alınmış sayılır.", "Adı verilen kurumlar katılımcı sayılır; plan veya rapor tarihleri görüşmenin ayrıntısı değildir."]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const UNITS = DATA.units;
let annotator = null, labels = {}, idx = 0;

// PDF text keeps the PDF's line breaks; join wrapped lines for reading (whitespace only, words unchanged).
const NEW_ITEM = /^([•▪●·–]|-\s|\(?[a-z0-9ivx]{1,4}[.)]\s)/i;
const ENDS_SENTENCE = /[.:;!?)]$/;
function reflow(text) {
  return text.replace(/\r/g, '').split(/\n\s*\n/).map(block => {
    let out = '', prev = '', prevStartsLine = true;
    for (const line of block.split('\n').map(l => l.trim()).filter(Boolean)) {
      const heading = prevStartsLine && prev.length < 70 && /^[A-Z0-9]/.test(prev) && !ENDS_SENTENCE.test(prev) && /^[A-Z]/.test(line);
      let startsLine = false;
      if (!out) { out = line; startsLine = true; }
      else if (NEW_ITEM.test(line) || heading) { out += '\n' + line; startsLine = true; }
      else if (/[a-z]-$/.test(out) && /^[a-z]/.test(line)) out += line;
      else out += ' ' + line;
      prevStartsLine = startsLine || ENDS_SENTENCE.test(prev);
      prev = line;
    }
    return out;
  }).filter(Boolean).join('\n\n');
}

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const storeKey = () => 'oncesealed-citations-' + annotator;
function save() { try { localStorage.setItem(storeKey(), JSON.stringify(labels)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(storeKey()) || '{}'); } catch (e) { return {}; } }
const answered = () => UNITS.filter(u => labels[u.uid]).length;

function intro() {
  document.getElementById('app').innerHTML = `
  <div class="intro card">
    <h2>Paragraf kontrolü (${UNITS.length} madde)</h2>
    <p>Her maddede bir soru ve belgeden tek bir paragraf var. Soru: <b>bu paragraf, tek başına, sorunun aradığı kanıtı içeriyor mu?</b></p>
    <ul>${DATA.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    <p>Paragrafların bir kısmını model seçti, bir kısmı başka yerlerden; hangisinin hangisi olduğu gösterilmiyor. Model cevaplarına veya <code>key.json</code> dosyasına bakma.</p>
    <p class="keys">Kısayollar: E = evet, H = hayır, B = belirsiz, ← → = önceki/sonraki. Cevaplar bu tarayıcıda saklanır; bitince “Dışa aktar”.</p>
    <p><input id="name" placeholder="Adın" style="font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px">
    <button class="primary" id="start">Başla</button></p>
  </div>`;
  document.getElementById('start').onclick = () => {
    const n = document.getElementById('name').value.trim();
    if (!n) return;
    annotator = n; labels = load();
    idx = Math.max(0, UNITS.findIndex(u => !labels[u.uid]));
    render();
  };
}

function render() {
  const u = UNITS[idx], q = DATA.questions[u.question_id], cur = labels[u.uid] || '';
  document.getElementById('app').innerHTML = `
  <header><b>Paragraf kontrolü</b><span>${esc(annotator)}</span>
    <div class="bar"><div style="width:${100 * answered() / UNITS.length}%"></div></div>
    <span>${answered()} / ${UNITS.length}</span><button id="export">Dışa aktar</button></header>
  <main>
    <div class="card">
      <div class="meta">${idx + 1}. madde · ${esc(u.project_id)} ${esc(u.project_name)} · sayfa ${u.page} · <span class="pid">${esc(u.paragraph_id)}</span></div>
      <p class="para">${esc(reflow(u.text))}</p>
    </div>
    <div class="card">
      <div><span class="qid">${u.question_id}</span>${esc(q.text)}</div>
      <div class="tr">${esc(q.tr)}</div>
      <div class="hint"><b>Evet:</b> ${esc(q.yes_if)}</div>
      <div class="hint"><b>Hayır:</b> ${esc(q.no_if)}</div>
      <div class="opts">
        ${[['yes','Evet'],['no','Hayır'],['unclear','Belirsiz']].map(([v, t]) =>
          `<label><input type="radio" name="a" value="${v}" ${cur === v ? 'checked' : ''}><span>${t}</span></label>`).join('')}
      </div>
    </div>
    <div class="nav"><button id="prev" ${idx === 0 ? 'disabled' : ''}>← Önceki</button>
      <button id="next" class="primary">${idx === UNITS.length - 1 ? 'Son' : 'Sonraki →'}</button></div>
  </main>`;
  document.querySelectorAll('input[name=a]').forEach(r => r.onchange = () => set(r.value));
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.getElementById('export').onclick = exportLabels;
  window.scrollTo(0, 0);
}

function set(v) { labels[UNITS[idx].uid] = v; save(); render(); }
function go(d) { idx = Math.min(UNITS.length - 1, Math.max(0, idx + d)); render(); }

function exportLabels() {
  const out = { annotator, kind: 'human', version: DATA.version, exported_at: new Date().toISOString(),
                answered: answered(), total: UNITS.length,
                labels: UNITS.filter(u => labels[u.uid]).map(u => ({ uid: u.uid, question_id: u.question_id,
                        paragraph_id: u.paragraph_id, answer: labels[u.uid] })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = 'citations_' + annotator.replace(/\W+/g, '_') + '.json';
  a.click();
}

document.addEventListener('keydown', e => {
  if (!annotator || e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  const k = e.key.toLowerCase();
  if (k === 'e') set('yes'); else if (k === 'h') set('no'); else if (k === 'b') set('unclear');
  else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
intro();
</script>
</body>
</html>
